# GE Graph + RMSNorm融合 + 同层o_proj权重预取16 MiB。
model_config:
  model_name: "qwen3_8b"
  model_path: "Qwen/Qwen3-8B"
  dtype: "bfloat16"
  exe_mode: "ge_graph"
  enable_profiler: False
  with_ckpt: True
  enable_cache_compile: False
  enable_static_kernel: False
  custom_params:
    enable_npu_rmsnorm: True
    enable_add_rmsnorm: True
    enable_prefetch: True
    # 在Fused Attention之前预取紧随其后的同层o_proj权重。
    prefetch_size: 16777216  # 16 MiB，约占完整32 MiB BF16 o_proj的50%。

data_config:
  dataset: "default"
  input_truncated_len: 256

parallel_config:
  world_size: 1
  attn_tp_size: 1
  moe_tp_size: 1
  embed_tp_size: 1
  lmhead_tp_size: 1

scheduler_config:
  max_new_tokens: 64
  batch_size: 1
  enable_thinking: False
