model_config:
  model_name: "qwen3_1_7b"
  model_path: "data/models/Qwen3-1.7B-W8A8"   # 量化配置由权重目录 config.json 内嵌的 compressed-tensors 自动加载，yaml 无需显式声明 quant_config
  dtype: "bfloat16"
  exe_mode: "eager"
  enable_profiler: False
  with_ckpt: True
  enable_cache_compile: False
  enable_static_kernel: False

data_config:
  dataset: "default"
  input_truncated_len: 256

parallel_config:
  world_size: 1
  attn_tp_size: 1
  moe_tp_size: 1
  embed_tp_size: 1
  lmhead_tp_size: 1

scheduler_config:
  max_new_tokens: 64
  batch_size: 1
  enable_thinking: False
