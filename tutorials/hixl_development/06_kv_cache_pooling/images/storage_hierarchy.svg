<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6B7280"/>
    </marker>
  </defs>
  <rect width="880" height="200" fill="#FFFFFF"/>

  <text x="440" y="28" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="16" fill="#1F2937" font-weight="bold" text-anchor="middle">存储介质层次</text>

  <!-- NPU HBM -->
  <rect x="30" y="55" width="240" height="100" rx="10" ry="10" fill="#FEE2E2" stroke="#F87171" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="80" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="14" fill="#DC2626" font-weight="bold" text-anchor="middle">NPU HBM</text>
  <text x="150" y="100" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11" fill="#991B1B" text-anchor="middle">推理引擎管理</text>
  <text x="150" y="120" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">32~64 GB · 最快</text>
  <text x="150" y="140" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="9" fill="#9CA3AF" text-anchor="middle">vLLM / SGLang 自行管理</text>

  <!-- Arrow -->
  <line x1="275" y1="105" x2="310" y2="105" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>
  <text x="293" y="98" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="8" fill="#6B7280" text-anchor="middle">D2H</text>
  <line x1="310" y1="115" x2="275" y2="115" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>
  <text x="293" y="130" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="8" fill="#6B7280" text-anchor="middle">H2D</text>

  <!-- Host DRAM -->
  <rect x="320" y="55" width="240" height="100" rx="10" ry="10" fill="#D1FAE5" stroke="#059669" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="440" y="80" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="14" fill="#059669" font-weight="bold" text-anchor="middle">Host DRAM 内存池</text>
  <text x="440" y="100" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11" fill="#065F46" font-weight="bold" text-anchor="middle">池化系统管理</text>
  <text x="440" y="120" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">数百 GB · 池化核心</text>
  <text x="440" y="140" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="9" fill="#059669" text-anchor="middle">global_segment · 跨节点共享</text>

  <!-- Arrow -->
  <line x1="565" y1="105" x2="600" y2="105" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="583" y="98" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="8" fill="#6B7280" text-anchor="middle">溢出</text>

  <!-- SSD -->
  <rect x="610" y="55" width="240" height="100" rx="10" ry="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="730" y="80" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="14" fill="#D97706" font-weight="bold" text-anchor="middle">SSD（可选）</text>
  <text x="730" y="100" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11" fill="#92400E" text-anchor="middle">池化系统管理</text>
  <text x="730" y="120" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">TB 级 · 最慢</text>
  <text x="730" y="140" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="9" fill="#9CA3AF" text-anchor="middle">enable_ssd_offload · 冷数据</text>

  <!-- Bottom note -->
  <text x="440" y="185" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11" fill="#1F2937" text-anchor="middle">"池化" = 多节点 Host DRAM 汇聚成全局内存池，由 Master 统一调度</text>
</svg>
