  <rect x="590" y="305" width="230" height="45" rx="8" ry="8" fill="none" fill-opacity="1.0" stroke="#7C3AED" stroke-width="2"/>
  <text x="705.0" y="333" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="13" fill="#7C3AED" fill-opacity="1.0" font-weight="bold" text-anchor="middle">Decode 计算（Token 生成）</text>
  <line x1="705.0" y1="353" x2="705.0" y2="370" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="590" y="370" width="230" height="45" rx="8" ry="8" fill="#FFFFFF" fill-opacity="1.0" stroke="#A78BFA" stroke-width="1.5" filter="url(#shadow_s)"/>
