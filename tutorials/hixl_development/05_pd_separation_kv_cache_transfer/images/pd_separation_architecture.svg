  <rect x="590" y="430" width="230" height="30" rx="6" ry="6" fill="#FFFFFF" fill-opacity="1.0" stroke="#D1D5DB" stroke-width="1"/>
  <text x="705.0" y="450" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11" fill="#6B7280" fill-opacity="1.0" font-weight="normal" text-anchor="middle">优势：低延迟生成</text>
  <rect x="50" y="520" width="800" height="30" rx="6" ry="6" fill="#F3F4F6" fill-opacity="1.0" stroke="#D1D5DB" stroke-width="1"/>
  <text x="450" y="540" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" fill="#1F2937" fill-opacity="1.0" font-weight="normal" text-anchor="middle">资源解耦：P 独立扩展吞吐 | D 独立优化延迟 | KV Cache 跨节点共享</text>
