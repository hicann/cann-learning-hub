  <text x="705.0" y="218" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="16" fill="#7C3AED" fill-opacity="1.0" font-weight="bold" text-anchor="middle">Decode 集群（D 节点）</text>
  <rect x="590" y="240" width="230" height="45" rx="8" ry="8" fill="#D1FAE5" fill-opacity="1.0" stroke="#059669" stroke-width="1.5" filter="url(#shadow_s)"/>
  <text x="705.0" y="268" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="13" fill="#059669" fill-opacity="1.0" font-weight="bold" text-anchor="middle">接收 KV Cache</text>
