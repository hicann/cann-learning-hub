  <text x="450.0" y="328" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11" fill="#FB923C" fill-opacity="1.0" font-weight="normal" text-anchor="middle">llm-datadist / HIXL</text>
