  <text x="40" y="472" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">通信</text>
  <text x="40" y="556" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">硬件</text>

  <rect x="80" y="600" width="720" height="24" rx="4" ry="4" fill="none" stroke="none"/>
  <text x="440" y="620" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11" fill="#9CA3AF" font-style="italic" text-anchor="middle">从上到下：上层框架调用底层传输，每层屏蔽下层细节</text>
