<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="shadow_s" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6B7280"/>
    </marker>
    <marker id="arrow_b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrow_p" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7C3AED"/>
    </marker>
  </defs>
  <rect width="880" height="480" fill="#FFFFFF"/>
  <text x="440" y="35" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="22" fill="#1F2937" font-weight="bold" text-anchor="middle">Prefill 与 Decode 计算特征对比</text>

  <!-- Prefill 阶段 -->
  <rect x="50" y="65" width="370" height="345" rx="12" ry="12" fill="#DBEAFE" fill-opacity="1.0" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="93" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="16" fill="#2563EB" font-weight="bold" text-anchor="middle">Prefill 阶段</text>
  <rect x="130" y="103" width="210" height="24" rx="5" ry="5" fill="#2563EB" fill-opacity="0.15" stroke="#2563EB" stroke-width="1"/>
  <text x="235" y="120" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" fill="#2563EB" font-weight="bold" text-anchor="middle">计算密集型 (Compute-Bound)</text>

  <!-- Prompt tokens -->
  <text x="235" y="152" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">输入 Prompt（长度 S）</text>
  <rect x="80" y="160" width="310" height="30" rx="5" ry="5" fill="#FFFFFF" fill-opacity="1.0" stroke="#60A5FA" stroke-width="1" filter="url(#shadow_s)"/>
  <text x="92" y="180" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11" fill="#2563EB" font-weight="bold" text-anchor="start">T1</text>
  <text x="125" y="180" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11" fill="#2563EB" text-anchor="start">T2</text>
  <text x="158" y="180" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11" fill="#2563EB" text-anchor="start">T3</text>
  <text x="370" y="180" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11" fill="#2563EB" text-anchor="end">... Tn</text>

  <line x1="235" y1="195" x2="235" y2="213" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow_b)"/>

  <!-- Matrix multiply -->
  <rect x="80" y="215" width="310" height="50" rx="8" ry="8" fill="#2563EB" fill-opacity="0.2" stroke="#2563EB" stroke-width="2" filter="url(#shadow_s)"/>
  <text x="235" y="245" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="13" fill="#2563EB" font-weight="bold" text-anchor="middle">大规模矩阵乘（高算力消耗）</text>

  <!-- Metrics -->
  <line x1="80" y1="280" x2="390" y2="280" stroke="#93C5FD" stroke-width="1"/>
  <text x="90" y="303" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" fill="#1F2937" text-anchor="start">算术强度</text>
  <text x="380" y="303" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" fill="#2563EB" font-weight="bold" text-anchor="end">≈ 2S（高）</text>
  <text x="90" y="326" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" fill="#1F2937" text-anchor="start">性能瓶颈</text>
  <text x="380" y="326" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" fill="#2563EB" font-weight="bold" text-anchor="end">NPU 算力</text>
  <text x="90" y="349" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" fill="#1F2937" text-anchor="start">批处理</text>
  <text x="380" y="349" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" fill="#2563EB" font-weight="bold" text-anchor="end">受显存限制</text>
  <text x="90" y="372" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" fill="#1F2937" text-anchor="start">延迟指标</text>
  <text x="380" y="372" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" fill="#2563EB" font-weight="bold" text-anchor="end">TTFT</text>
  <text x="90" y="395" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" fill="#1F2937" text-anchor="start">优化方向</text>
  <text x="380" y="395" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" fill="#2563EB" font-weight="bold" text-anchor="end">提升算力利用率</text>

  <!-- Decode 阶段 -->
  <rect x="460" y="65" width="370" height="345" rx="12" ry="12" fill="#EDE9FE" fill-opacity="1.0" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
  <text x="645" y="93" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="16" fill="#7C3AED" font-weight="bold" text-anchor="middle">Decode 阶段</text>
  <rect x="540" y="103" width="210" height="24" rx="5" ry="5" fill="#7C3AED" fill-opacity="0.15" stroke="#7C3AED" stroke-width="1"/>
  <text x="645" y="120" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" fill="#7C3AED" font-weight="bold" text-anchor="middle">访存密集型 (Memory-Bound)</text>

  <!-- KV Cache read -->
  <text x="645" y="152" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">逐 Token 读取 KV Cache</text>
  <rect x="490" y="160" width="310" height="30" rx="5" ry="5" fill="#D1FAE5" fill-opacity="1.0" stroke="#059669" stroke-width="1" filter="url(#shadow_s)"/>
  <text x="645" y="180" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="11" fill="#059669" font-weight="bold" text-anchor="middle">KV Cache（全部层 · 大量访存）</text>

  <line x1="645" y1="195" x2="645" y2="213" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow_p)"/>

  <!-- Single token -->
  <rect x="490" y="215" width="310" height="50" rx="8" ry="8" fill="#7C3AED" fill-opacity="0.2" stroke="#7C3AED" stroke-width="2" filter="url(#shadow_s)"/>
  <text x="645" y="245" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="13" fill="#7C3AED" font-weight="bold" text-anchor="middle">单 Token 向量乘（低计算量）</text>

  <!-- Metrics -->
  <line x1="490" y1="280" x2="800" y2="280" stroke="#C4B5FD" stroke-width="1"/>
  <text x="500" y="303" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" fill="#1F2937" text-anchor="start">算术强度</text>
  <text x="790" y="303" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" fill="#7C3AED" font-weight="bold" text-anchor="end">≈ 2（低）</text>
  <text x="500" y="326" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" fill="#1F2937" text-anchor="start">性能瓶颈</text>
  <text x="790" y="326" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" fill="#7C3AED" font-weight="bold" text-anchor="end">显存带宽</text>
  <text x="500" y="349" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" fill="#1F2937" text-anchor="start">批处理</text>
  <text x="790" y="349" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" fill="#7C3AED" font-weight="bold" text-anchor="end">适合大批量</text>
  <text x="500" y="372" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" fill="#1F2937" text-anchor="start">延迟指标</text>
  <text x="790" y="372" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" fill="#7C3AED" font-weight="bold" text-anchor="end">TPOT</text>
  <text x="500" y="395" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" fill="#1F2937" text-anchor="start">优化方向</text>
  <text x="790" y="395" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="12" fill="#7C3AED" font-weight="bold" text-anchor="end">提升带宽利用率</text>

  <!-- Bottom summary -->
  <rect x="50" y="425" width="780" height="42" rx="8" ry="8" fill="#FEF2F2" fill-opacity="1.0" stroke="#DC2626" stroke-width="1.5" filter="url(#shadow_s)"/>
  <text x="440" y="448" font-family="'Noto Sans CJK SC', 'Noto Sans', sans-serif" font-size="13" fill="#DC2626" font-weight="bold" text-anchor="middle">融合部署矛盾：Prefill 需要高算力，Decode 需要高带宽 — 同一组硬件无法同时最优化</text>
</svg>
