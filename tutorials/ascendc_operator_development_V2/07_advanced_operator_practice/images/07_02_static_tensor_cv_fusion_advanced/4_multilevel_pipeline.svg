<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">K 方向多级流水</title>
  <desc id="desc">L1 Ping 中的 K0 到 K3 依次送入 L0；MTE2 同时预取 L1 Pong 的 K4 到 K7。中间批次省略，最后消费 L1 Pong 的 K28 到 K31，随后 Fixpipe 输出。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172033">
    <text x="48" y="54" font-size="28" font-weight="700">K 方向多级流水</text>
    <text x="48" y="84" font-size="16" fill="#596579">L1 每批包含 4 个 baseK；L0A/L0B 按单个 baseK 在 Ping/Pong 间切换</text>

    <g transform="translate(48 126)">
      <g font-size="17" font-weight="700">
        <text x="0" y="48">MTE2</text><text x="0" y="168">MTE1</text>
        <text x="0" y="288">Cube</text><text x="0" y="408">Fixpipe</text>
      </g>
      <g stroke="#CBD5E1" stroke-width="2">
        <line x1="104" y1="54" x2="1104" y2="54"/><line x1="104" y1="174" x2="1104" y2="174"/>
        <line x1="104" y1="294" x2="1104" y2="294"/><line x1="104" y1="414" x2="1104" y2="414"/>
      </g>

      <g font-size="14" text-anchor="middle">
        <rect x="118" y="20" width="190" height="68" rx="8" fill="#DCEBFA" stroke="#3568A8" stroke-width="2"/>
        <text x="213" y="49" font-weight="700">首批搬入</text><text x="213" y="71">L1 Ping：K0-K3</text>

        <rect x="336" y="20" width="218" height="68" rx="8" fill="#DCEBFA" stroke="#3568A8" stroke-width="2"/>
        <text x="445" y="49" font-weight="700">与 K0-K3 重叠预取</text><text x="445" y="71">L1 Pong：K4-K7</text>

        <rect x="716" y="20" width="248" height="68" rx="8" fill="#DCEBFA" stroke="#3568A8" stroke-width="2"/>
        <text x="840" y="49" font-weight="700">与 K24-K27 重叠预取</text><text x="840" y="71">L1 Pong：K28-K31</text>

        <rect x="154" y="140" width="92" height="68" rx="8" fill="#E5F3EA" stroke="#2F855A" stroke-width="2"/>
        <text x="200" y="168">L0 Ping</text><text x="200" y="190">K0</text>
        <rect x="258" y="140" width="92" height="68" rx="8" fill="#E5F3EA" stroke="#2F855A" stroke-width="2"/>
        <text x="304" y="168">L0 Pong</text><text x="304" y="190">K1</text>
        <rect x="362" y="140" width="92" height="68" rx="8" fill="#E5F3EA" stroke="#2F855A" stroke-width="2"/>
        <text x="408" y="168">L0 Ping</text><text x="408" y="190">K2</text>
        <rect x="466" y="140" width="92" height="68" rx="8" fill="#E5F3EA" stroke="#2F855A" stroke-width="2"/>
        <text x="512" y="168">L0 Pong</text><text x="512" y="190">K3</text>

        <rect x="692" y="140" width="92" height="68" rx="8" fill="#E5F3EA" stroke="#2F855A" stroke-width="2"/>
        <text x="738" y="168">L0 Ping</text><text x="738" y="190">K28</text>
        <rect x="796" y="140" width="92" height="68" rx="8" fill="#E5F3EA" stroke="#2F855A" stroke-width="2"/>
        <text x="842" y="168">L0 Pong</text><text x="842" y="190">K29</text>
        <rect x="900" y="140" width="92" height="68" rx="8" fill="#E5F3EA" stroke="#2F855A" stroke-width="2"/>
        <text x="946" y="168">L0 Ping</text><text x="946" y="190">K30</text>
        <rect x="1004" y="140" width="92" height="68" rx="8" fill="#E5F3EA" stroke="#2F855A" stroke-width="2"/>
        <text x="1050" y="168">L0 Pong</text><text x="1050" y="190">K31</text>

        <rect x="202" y="260" width="92" height="68" rx="8" fill="#FFF0D6" stroke="#B7791F" stroke-width="2"/>
        <text x="248" y="300">MMAD K0</text>
        <rect x="306" y="260" width="92" height="68" rx="8" fill="#FFF0D6" stroke="#B7791F" stroke-width="2"/>
        <text x="352" y="300">MMAD K1</text>
        <rect x="410" y="260" width="92" height="68" rx="8" fill="#FFF0D6" stroke="#B7791F" stroke-width="2"/>
        <text x="456" y="300">MMAD K2</text>
        <rect x="514" y="260" width="92" height="68" rx="8" fill="#FFF0D6" stroke="#B7791F" stroke-width="2"/>
        <text x="560" y="300">MMAD K3</text>

        <rect x="740" y="260" width="92" height="68" rx="8" fill="#FFF0D6" stroke="#B7791F" stroke-width="2"/>
        <text x="786" y="300">MMAD K28</text>
        <rect x="844" y="260" width="92" height="68" rx="8" fill="#FFF0D6" stroke="#B7791F" stroke-width="2"/>
        <text x="890" y="300">MMAD K29</text>
        <rect x="948" y="260" width="92" height="68" rx="8" fill="#FFF0D6" stroke="#B7791F" stroke-width="2"/>
        <text x="994" y="300">MMAD K30</text>
        <rect x="1052" y="260" width="92" height="68" rx="8" fill="#FFF0D6" stroke="#B7791F" stroke-width="2"/>
        <text x="1098" y="300">MMAD K31</text>

        <rect x="994" y="380" width="150" height="68" rx="8" fill="#EEE8F8" stroke="#6B4FA1" stroke-width="2"/>
        <text x="1069" y="409" font-weight="700">全部 K 累加完成</text><text x="1069" y="431">L0C → Fixpipe</text>
      </g>

      <g stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)">
        <path d="M213 88V112H200V138"/><path d="M213 112H304V138"/>
        <path d="M213 112H408V138"/><path d="M213 112H512V138"/>
        <path d="M840 88V112H738V138"/><path d="M840 112H842V138"/>
        <path d="M840 112H946V138"/><path d="M840 112H1050V138"/>

        <line x1="225" y1="208" x2="238" y2="258"/><line x1="329" y1="208" x2="342" y2="258"/>
        <line x1="433" y1="208" x2="446" y2="258"/><line x1="537" y1="208" x2="550" y2="258"/>
        <line x1="763" y1="208" x2="776" y2="258"/><line x1="867" y1="208" x2="880" y2="258"/>
        <line x1="971" y1="208" x2="984" y2="258"/><line x1="1075" y1="208" x2="1088" y2="258"/>
        <line x1="1098" y1="328" x2="1074" y2="378"/>
      </g>

      <rect x="620" y="18" width="60" height="312" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5"/>
      <text x="650" y="148" font-size="24" text-anchor="middle" fill="#64748B">...</text>
      <text x="650" y="178" font-size="13" text-anchor="middle" fill="#596579">K4-K27</text>
      <text x="650" y="198" font-size="13" text-anchor="middle" fill="#596579">中间批次</text>
      <text x="650" y="218" font-size="13" text-anchor="middle" fill="#596579">省略</text>

      <rect x="104" y="476" width="1000" height="54" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
      <text x="604" y="499" font-size="15" text-anchor="middle">L1 Ping K0-K3 只供给 K0-K3；预取的 L1 Pong K4-K7 在下一批才被消费</text>
      <text x="604" y="520" font-size="15" text-anchor="middle">K31 的 MMAD 完成后才执行 Fixpipe；图中时间轴省略 K4-K27 的相同交替过程</text>
    </g>
  </g>
</svg>
