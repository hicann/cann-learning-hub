<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="310" fill="#ffffff"/>

  <text x="30" y="38" font-size="20" font-weight="bold" fill="#111827">分批数据通路（Tensor API，L1BatchSize / L0BatchSize）</text>

  <!-- GM -->
  <rect x="40" y="110" width="120" height="86" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="78" y="142" font-size="15" fill="#1e40af">GM</text>
  <text x="52" y="164" font-size="11" fill="#3758a8">A/B/Bias: ND</text>
  <text x="52" y="180" font-size="11" fill="#3758a8">3D 布局</text>

  <path d="M160,150 L215,150" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="118" y="132" font-size="11" fill="#6b7280">copy_gm_to_l1</text>
  <text x="112" y="172" font-size="10" fill="#9ca3af">L1BatchSize=32</text>

  <!-- L1 -->
  <rect x="220" y="110" width="120" height="86" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="262" y="142" font-size="15" fill="#166534">L1</text>
  <text x="234" y="164" font-size="11" fill="#15803d">A: NZ 3D</text>
  <text x="234" y="180" font-size="11" fill="#15803d">B/Bias: NZ/ND 3D</text>

  <path d="M340,140 L395,120" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M340,160 L395,178" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="318" y="108" font-size="11" fill="#6b7280">copy_l1_to_l0a/b</text>
  <text x="330" y="212" font-size="10" fill="#9ca3af">L0BatchSize=4</text>

  <!-- L0A/L0B -->
  <rect x="400" y="76" width="120" height="52" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="440" y="98" font-size="13" fill="#991b1b">L0A</text>
  <text x="424" y="118" font-size="11" fill="#b91c1c">NZ 3D, half</text>

  <rect x="400" y="150" width="120" height="52" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="440" y="172" font-size="13" fill="#991b1b">L0B</text>
  <text x="424" y="192" font-size="11" fill="#b91c1c">ZN 3D, half</text>

  <!-- BiasTable：L1 直连 -->
  <path d="M340,182 C370,240 400,240 420,236" stroke="#374151" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="330" y="252" font-size="11" fill="#6b7280">copy_l1_to_biastable</text>

  <rect x="424" y="222" width="96" height="46" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="436" y="242" font-size="12" fill="#155e75">BiasTable</text>
  <text x="448" y="260" font-size="10" fill="#0e7490">ND, FP32</text>

  <path d="M520,106 L575,140" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M520,176 L575,160" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M520,245 C550,225 565,200 578,172" stroke="#374151" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Mmad -->
  <rect x="580" y="120" width="110" height="60" rx="6" fill="#fdf4ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="606" y="147" font-size="15" fill="#6b21a8">mmad</text>
  <text x="588" y="167" font-size="11" fill="#7e22ce">FP32 + Bias</text>

  <path d="M690,150 L745,150" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- L0C -->
  <rect x="750" y="110" width="120" height="86" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="792" y="142" font-size="15" fill="#92400e">L0C</text>
  <text x="764" y="164" font-size="11" fill="#b45309">NZ 3D, FP32</text>
  <text x="762" y="180" font-size="11" fill="#b45309">逐 batch 写入</text>

  <!-- Fixpipe 回 GM -->
  <path d="M810,196 C810,282 130,282 105,200" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="360" y="298" font-size="12" fill="#c2410c">copy_l0c_to_gm（Fixpipe：FP32 → half 转换，一次搬出 L0BatchSize 个结果矩阵）</text>
</svg>
