<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">L1/L0 Double Buffer 切换时序与事件依赖</title>
  <desc id="desc">L1 按四个 baseK 子块切换 Ping/Pong；L0A 和 L0B 按单个 baseK 子块切换，并通过正向和反向事件保护读写顺序。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1200" height="660" fill="#F8FAFC"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172033">
    <text x="48" y="54" font-size="28" font-weight="700">L1/L0 Double Buffer 切换时序与事件依赖</text>
    <text x="48" y="84" font-size="16" fill="#596579">L1 切换周期：4 * baseK；L0 切换周期：1 * baseK</text>

    <rect x="48" y="112" width="1104" height="190" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="72" y="145" font-size="21" font-weight="700">L1 批量 Double Buffer（A1/B1）</text>
    <text x="390" y="160" font-size="14" text-anchor="middle" fill="#596579">时间窗 T0</text>
    <text x="800" y="160" font-size="14" text-anchor="middle" fill="#596579">时间窗 T1</text>

    <g font-size="15" text-anchor="middle">
      <text x="110" y="198" font-weight="700">Ping</text>
      <rect x="240" y="168" width="300" height="44" rx="8" fill="#DCEBFA" stroke="#3568A8" stroke-width="2"/>
      <text x="390" y="196">MTE1 读取 K0-K3</text>
      <rect x="650" y="168" width="300" height="44" rx="8" fill="#E5F3EA" stroke="#2F855A" stroke-width="2"/>
      <text x="800" y="196">MTE2 写入 K8-K11</text>
      <line x1="540" y1="190" x2="642" y2="190" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="591" y="180" font-size="12" fill="#596579">MTE1_MTE2</text>

      <text x="110" y="254" font-weight="700">Pong</text>
      <rect x="240" y="224" width="300" height="44" rx="8" fill="#E5F3EA" stroke="#2F855A" stroke-width="2"/>
      <text x="390" y="252">MTE2 写入 K4-K7</text>
      <rect x="650" y="224" width="300" height="44" rx="8" fill="#DCEBFA" stroke="#3568A8" stroke-width="2"/>
      <text x="800" y="252">MTE1 读取 K4-K7</text>
      <line x1="540" y1="246" x2="642" y2="246" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="591" y="236" font-size="12" fill="#596579">MTE2_MTE1</text>
    </g>
    <text x="72" y="289" font-size="14" fill="#596579">读：A1=(kBlockIdx/stepKa)%2；B1=(kBlockIdx/stepKb)%2（0=Ping，1=Pong）</text>
    <text x="720" y="289" font-size="14" fill="#596579">写：a1CopyInIdx / b1CopyInIdx（0=Ping，1=Pong）</text>

    <rect x="48" y="322" width="1104" height="260" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="72" y="355" font-size="21" font-weight="700">L0 逐块 Double Buffer（A2/B2）</text>
    <text x="620" y="355" font-size="15" fill="#596579">切换索引：mte1DBFlag = 0 / 1</text>
    <text x="1080" y="380" font-size="13" text-anchor="end" fill="#596579">MTE1 → Cube：MTE1_M</text>

    <g font-size="14" text-anchor="middle">
      <text x="100" y="424" font-size="16" font-weight="700">MTE1</text>
      <rect x="180" y="397" width="170" height="44" rx="8" fill="#DCEBFA" stroke="#3568A8" stroke-width="2"/>
      <text x="265" y="424">A2/B2 Ping K0</text>
      <rect x="390" y="397" width="170" height="44" rx="8" fill="#E5F3EA" stroke="#2F855A" stroke-width="2"/>
      <text x="475" y="424">A2/B2 Pong K1</text>
      <rect x="600" y="397" width="170" height="44" rx="8" fill="#DCEBFA" stroke="#3568A8" stroke-width="2"/>
      <text x="685" y="424">A2/B2 Ping K2</text>
      <rect x="810" y="397" width="170" height="44" rx="8" fill="#E5F3EA" stroke="#2F855A" stroke-width="2"/>
      <text x="895" y="424">A2/B2 Pong K3</text>

      <text x="100" y="484" font-size="16" font-weight="700">Cube</text>
      <rect x="250" y="457" width="170" height="44" rx="8" fill="#FFF0D6" stroke="#B7791F" stroke-width="2"/>
      <text x="335" y="484">MMAD Ping K0</text>
      <rect x="460" y="457" width="170" height="44" rx="8" fill="#FFF0D6" stroke="#B7791F" stroke-width="2"/>
      <text x="545" y="484">MMAD Pong K1</text>
      <rect x="670" y="457" width="170" height="44" rx="8" fill="#FFF0D6" stroke="#B7791F" stroke-width="2"/>
      <text x="755" y="484">MMAD Ping K2</text>
      <rect x="880" y="457" width="170" height="44" rx="8" fill="#FFF0D6" stroke="#B7791F" stroke-width="2"/>
      <text x="965" y="484">MMAD Pong K3</text>
    </g>
    <g stroke="#64748B" stroke-width="2" marker-end="url(#arrow)">
      <line x1="315" y1="441" x2="325" y2="455"/>
      <line x1="525" y1="441" x2="535" y2="455"/>
      <line x1="735" y1="441" x2="745" y2="455"/>
      <line x1="945" y1="441" x2="955" y2="455"/>
    </g>
    <g font-size="14" fill="#172033">
      <text x="92" y="542">MMAD Ping K0 完成</text>
      <line x1="235" y1="537" x2="485" y2="537" stroke="#B7791F" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="360" y="527" text-anchor="middle" fill="#596579">M_MTE1（Ping）</text>
      <text x="500" y="542">MTE1 Ping K2 可写</text>

      <text x="650" y="542">MMAD Pong K1 完成</text>
      <line x1="800" y1="537" x2="980" y2="537" stroke="#B7791F" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="890" y="527" text-anchor="middle" fill="#596579">M_MTE1（Pong）</text>
      <text x="1130" y="542" text-anchor="end">MTE1 Pong K3 可写</text>
    </g>

    <rect x="48" y="602" width="1104" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="600" y="629" font-size="16" text-anchor="middle">ready：MTE2_MTE1 / MTE1_M；release：MTE1_MTE2 / M_MTE1</text>
  </g>
</svg>
