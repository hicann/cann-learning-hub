<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Tile 片上存储容量</title>
  <desc id="desc">baseM 等于 240、baseK 等于 64、baseN 等于 256 时，L0A、L0B、L0C 和单个 Vector Core 的 UB 容量占用。</desc>
  <rect width="1200" height="660" fill="#F8FAFC"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172033">
    <text x="48" y="54" font-size="28" font-weight="700">Tile 片上存储容量</text>
    <text x="48" y="84" font-size="16" fill="#596579">baseM、baseK、baseN 对 L0 与单个 Vector Core UB 容量的约束</text>

    <g transform="translate(48 112)">
      <rect width="1104" height="72" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
      <text x="552" y="31" font-size="17" text-anchor="middle" fill="#596579">当前计算分块</text>
      <text x="552" y="57" font-size="23" font-weight="700" text-anchor="middle">baseM = 240　 baseK = 64　 baseN = 256</text>
    </g>

    <g transform="translate(48 210)">
      <rect width="536" height="154" rx="8" fill="#FFFFFF" stroke="#3568A8" stroke-width="2"/>
      <text x="24" y="34" font-size="20" font-weight="700">L0A：A 分块</text>
      <text x="24" y="61" font-size="16" fill="#596579">240 x 64 x 2 B = 30 KiB</text>
      <rect x="24" y="84" width="464" height="28" rx="5" fill="#E2E8F0"/>
      <rect x="24" y="84" width="435" height="28" rx="5" fill="#DCEBFA" stroke="#3568A8" stroke-width="2"/>
      <text x="256" y="104" font-size="14" text-anchor="middle">已用 30 KiB</text>
      <text x="512" y="104" font-size="14" text-anchor="end" fill="#596579">30 / 32 KiB</text>
      <text x="24" y="137" font-size="14" fill="#596579">单槽剩余 2 KiB</text>
    </g>

    <g transform="translate(616 210)">
      <rect width="536" height="154" rx="8" fill="#FFFFFF" stroke="#2F855A" stroke-width="2"/>
      <text x="24" y="34" font-size="20" font-weight="700">L0B：B 分块</text>
      <text x="24" y="61" font-size="16" fill="#596579">64 x 256 x 2 B = 32 KiB</text>
      <rect x="24" y="84" width="464" height="28" rx="5" fill="#E5F3EA" stroke="#2F855A" stroke-width="2"/>
      <text x="256" y="104" font-size="14" text-anchor="middle">已用 32 KiB</text>
      <text x="512" y="104" font-size="14" text-anchor="end" fill="#596579">32 / 32 KiB</text>
      <text x="24" y="137" font-size="14" fill="#596579">baseK 与 baseN 已达到单槽容量上限</text>
    </g>

    <g transform="translate(48 388)">
      <rect width="536" height="154" rx="8" fill="#FFFFFF" stroke="#B7791F" stroke-width="2"/>
      <text x="24" y="34" font-size="20" font-weight="700">L0C：float32 累加结果</text>
      <text x="24" y="61" font-size="16" fill="#596579">240 x 256 x 4 B = 240 KiB</text>
      <rect x="24" y="84" width="464" height="28" rx="5" fill="#E2E8F0"/>
      <rect x="24" y="84" width="435" height="28" rx="5" fill="#FFF0D6" stroke="#B7791F" stroke-width="2"/>
      <text x="256" y="104" font-size="14" text-anchor="middle">已用 240 KiB</text>
      <text x="512" y="104" font-size="14" text-anchor="end" fill="#596579">240 / 256 KiB</text>
      <text x="24" y="137" font-size="14" fill="#596579">baseM x baseN 共同决定输出 tile 大小</text>
    </g>

    <g transform="translate(616 388)">
      <rect width="536" height="154" rx="8" fill="#FFFFFF" stroke="#6B4FA1" stroke-width="2"/>
      <text x="24" y="34" font-size="20" font-weight="700">单个 Vector Core：UB 输入与输出</text>
      <text x="24" y="61" font-size="16" fill="#596579">(240 / 2) x 256 x 4 B = 120 KiB / Tensor</text>
      <rect x="24" y="84" width="464" height="28" rx="5" fill="#E2E8F0"/>
      <rect x="24" y="84" width="225" height="28" rx="5" fill="#DCEBFA" stroke="#3568A8" stroke-width="2"/>
      <rect x="249" y="84" width="225" height="28" fill="#EEE8F8" stroke="#6B4FA1" stroke-width="2"/>
      <text x="136" y="104" font-size="14" text-anchor="middle">输入 120 KiB</text>
      <text x="361" y="104" font-size="14" text-anchor="middle">输出 120 KiB</text>
      <text x="512" y="104" font-size="14" text-anchor="end" fill="#596579">240 / 248 KiB</text>
      <text x="24" y="137" font-size="14" fill="#596579">两个 Vector Core 各处理 120 行，单核保留 8 KiB</text>
    </g>

    <g transform="translate(48 568)">
      <rect width="1104" height="56" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
      <text x="24" y="35" font-size="16" fill="#596579">范围说明：本图只计算一个 L0 槽位和单个 Vector Core 的 UB；L1 批量深度与 Double Buffer 双槽总容量在第 4 章确定。</text>
    </g>
  </g>
</svg>
