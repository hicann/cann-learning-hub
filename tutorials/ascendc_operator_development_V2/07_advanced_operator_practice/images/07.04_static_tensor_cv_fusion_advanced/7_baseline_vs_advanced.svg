<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">MMAD-GELU 同 Shape 性能对照</title>
  <desc id="desc">相同矩阵规格、核心映射、Tile 和 CV 交接下，对照串行 MemBase 基线与采用多级流水和 RegBase 的 mmad_gelu_adv。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#F8FAFC"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172033">
    <text x="48" y="54" font-size="28" font-weight="700">MMAD-GELU 同 Shape 性能对照</text>
    <text x="48" y="84" font-size="16" fill="#596579">控制矩阵规模、Tile、核心映射与数据路径，只改变 Cube Core 流水和 Vector Core 编程方式</text>

    <rect x="48" y="112" width="520" height="354" rx="8" fill="#FFFFFF" stroke="#C94C4C" stroke-width="3"/>
    <text x="76" y="151" font-size="22" font-weight="700">同 Shape 对照</text>
    <text x="76" y="179" font-size="15" fill="#596579">无多级流水 · MemBase GELU · VF 关闭</text>
    <g font-size="14" text-anchor="middle">
      <rect x="76" y="214" width="106" height="58" rx="6" fill="#DCEBFA" stroke="#3568A8" stroke-width="2"/>
      <text x="129" y="238">GM → L1</text><text x="129" y="258">MTE2</text>
      <rect x="218" y="214" width="106" height="58" rx="6" fill="#E5F3EA" stroke="#2F855A" stroke-width="2"/>
      <text x="271" y="238">L1 → L0</text><text x="271" y="258">MTE1</text>
      <rect x="360" y="214" width="106" height="58" rx="6" fill="#FFF0D6" stroke="#B7791F" stroke-width="2"/>
      <text x="413" y="238">MMAD</text><text x="413" y="258">Cube</text>
      <line x1="182" y1="243" x2="212" y2="243" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="324" y1="243" x2="354" y2="243" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="271" y="301" font-size="15" fill="#8B2F2F">每个 K Tile 严格串行</text>

      <rect x="76" y="326" width="390" height="88" rx="6" fill="#FFF7F7" stroke="#F2B8B8" stroke-width="2"/>
      <text x="271" y="351" font-size="15" font-weight="700">GELU：8 条基础 API + 7 次 PIPE_V 屏障</text>
      <text x="271" y="378">Mul · Mul · Muls · Add · Muls · Exp · Adds · Div</text>
      <text x="271" y="400" fill="#596579">中间结果反复读写 UB</text>
    </g>

    <rect x="632" y="112" width="520" height="354" rx="8" fill="#FFFFFF" stroke="#2F855A" stroke-width="3"/>
    <text x="660" y="151" font-size="22" font-weight="700">mmad_gelu_adv</text>
    <text x="660" y="179" font-size="15" fill="#596579">Cube Core 多级流水 · Vector Core RegBase GELU</text>
    <g font-size="14" text-anchor="middle">
      <rect x="660" y="208" width="146" height="48" rx="6" fill="#DCEBFA" stroke="#3568A8" stroke-width="2"/>
      <text x="733" y="237">L1 Ping / Pong</text>
      <rect x="838" y="244" width="146" height="48" rx="6" fill="#E5F3EA" stroke="#2F855A" stroke-width="2"/>
      <text x="911" y="273">L0 Ping / Pong</text>
      <rect x="982" y="304" width="138" height="48" rx="6" fill="#FFF0D6" stroke="#B7791F" stroke-width="2"/>
      <text x="1051" y="333">MMAD</text>
      <path d="M806 232H866V238" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M984 268H1051V298" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="891" y="209" font-size="15" fill="#246B48">MTE2 / MTE1 / Cube 跨 Tile 重叠</text>

      <rect x="660" y="326" width="286" height="88" rx="6" fill="#EEF7F2" stroke="#A9D3B9" stroke-width="2"/>
      <text x="803" y="351" font-size="15" font-weight="700">GELU 寄存器算术链</text>
      <text x="803" y="378">1 × LoadAlign · 8 × Reg API</text>
      <text x="803" y="400">1 × StoreAlign</text>
    </g>

    <rect x="48" y="494" width="1104" height="112" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="76" y="525" font-size="16" font-weight="700">3510 真机结果</text>
    <g text-anchor="middle">
      <text x="300" y="555" font-size="14" fill="#596579">同 Shape 对照</text>
      <text x="300" y="582" font-size="21" font-weight="700" fill="#8B2F2F">77.360 us · 208.20 TFLOPS</text>
      <text x="890" y="555" font-size="14" fill="#596579">mmad_gelu_adv</text>
      <text x="890" y="582" font-size="21" font-weight="700" fill="#246B48">46.465 us · 346.63 TFLOPS</text>
    </g>
    <rect x="513" y="531" width="174" height="52" rx="6" fill="#EEF7F2" stroke="#2F855A" stroke-width="2"/>
    <text x="600" y="553" font-size="15" text-anchor="middle" fill="#246B48">Task Duration</text>
    <text x="600" y="576" font-size="18" font-weight="700" text-anchor="middle" fill="#246B48">-39.94% · 1.665x</text>

    <rect x="48" y="626" width="1104" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="600" y="652" font-size="14" text-anchor="middle" fill="#596579">固定条件：M/K/N=1920/2048/2048 · 32 个 AI Core · Tile=240/64/256 · L0C-UB 双目标交接</text>
  </g>
</svg>
