  <rect x="45" y="300" width="190" height="82" class="box" fill="#eef4ff" stroke="#6172f3"/><text x="140" y="333" text-anchor="middle" class="label">模型输入</text><text x="140" y="360" text-anchor="middle" class="text">KV Cache</text>
