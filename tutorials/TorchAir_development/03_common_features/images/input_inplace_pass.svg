    <style>.title{font:700 25px Arial,"Microsoft YaHei";fill:#101828}.label{font:600 19px Arial,"Microsoft YaHei";fill:#344054}.text{font:16px Arial,"Microsoft YaHei";fill:#475467}.box{rx:14;stroke-width:2}.arrow{stroke:#667085;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1000" height="440" rx="18" fill="#f8fafc"/>
