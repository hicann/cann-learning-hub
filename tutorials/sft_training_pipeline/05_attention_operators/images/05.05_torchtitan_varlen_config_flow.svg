<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1120" viewBox="0 0 1650 1120" role="img" aria-labelledby="title desc">
<title id="title">TorchTitan Config 类型驱动 VarLen metadata 的生产与消费</title>
<desc id="desc">DataLoader 让每条样本的位置编号从 0 开始。Trainer 根据 block-causal 语义找到样本起点并生成 VarlenMetadata；NPUVarlenAttention 通过 build 实例化，在 forward 中完成 BSND 到 TND 和 cu_seq 到 actual_seq 的翻译，再调用 CANN FusionAttention V3 sparse_mode 7。</desc>
