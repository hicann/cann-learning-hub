<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
<title id="title">Eager Attention 与 FlashAttention 的数据流对比</title>
<desc id="desc">上方 eager 路径在多个 kernel 之间物化并反复读写完整 score；下方 FlashAttention 将 tile 搬入片上存储，在融合 kernel 中完成 online softmax 与 PV 累加，只写最终输出。</desc>
