<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="840" viewBox="0 0 1500 840" role="img" aria-labelledby="title desc">
<title id="title">Packed 样本区间转换为 NPU VarLen Attention 参数</title>
<desc id="desc">三个 packed 样本的位置编号都从零开始；这些起点先变成样本长度和 cu_seq。TorchTitan 保留开头零，CANN 接收去掉零的累计结束位置；QKV 同时从 BSND reshape 为 TND，二者一起送入 FusionAttention V3 sparse_mode 7。</desc>
