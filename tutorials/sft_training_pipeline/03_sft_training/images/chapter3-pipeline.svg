<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="260" viewBox="0 0 1040 260" role="img" aria-labelledby="title desc">
  <title id="title">第三章训练闭环</title>
  <desc id="desc">依次完成数据与配置检查、二十步监督微调、同集评测与结果保存。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#344054"/>
    </marker>
    <style>
      .title { font: 700 22px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #101828; }
      .step { font: 700 17px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #101828; }
      .detail { font: 14px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #344054; }
      .number { font: 700 14px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .connector { fill: none; stroke: #344054; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1040" height="260" fill="#ffffff"/>
  <text class="title" x="520" y="35" text-anchor="middle">配置 → 训练 → 评测</text>

  <rect x="30" y="70" width="280" height="140" rx="8" fill="#ecfdf3" stroke="#12b76a" stroke-width="2"/>
  <circle cx="62" cy="102" r="17" fill="#067647"/>
  <text class="number" x="62" y="107" text-anchor="middle">1</text>
  <text class="step" x="90" y="108">检查数据与配置</text>
  <text class="detail" x="50" y="145">masked labels / recipe</text>
  <text class="detail" x="50" y="172">确认 seq_len 与 batch 口径</text>

  <path class="connector" d="M 310 140 H 375"/>

  <rect x="385" y="70" width="270" height="140" rx="8" fill="#eff8ff" stroke="#2e90fa" stroke-width="2"/>
  <circle cx="417" cy="102" r="17" fill="#175cd3"/>
  <text class="number" x="417" y="107" text-anchor="middle">2</text>
  <text class="step" x="445" y="108">运行 20-step SFT</text>
  <text class="detail" x="405" y="145">2 ranks / 2 dies</text>
  <text class="detail" x="405" y="172">保存 checkpoint 与 HF 权重</text>

  <path class="connector" d="M 655 140 H 720"/>

  <rect x="730" y="70" width="280" height="140" rx="8" fill="#fffaeb" stroke="#f79009" stroke-width="2"/>
  <circle cx="762" cy="102" r="17" fill="#b54708"/>
  <text class="number" x="762" y="107" text-anchor="middle">3</text>
  <text class="step" x="790" y="108">同集推理评测</text>
  <text class="detail" x="750" y="145">加载 base 与 SFT checkpoint</text>
  <text class="detail" x="750" y="172">保存逐局结果并对比指标</text>
</svg>
