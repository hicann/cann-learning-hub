<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400"
     role="img" aria-labelledby="title desc">
  <title id="title">OM 文件结构</title>
  <desc id="desc">OM 文件依次由 ModelFileHeader、ModelPartitionTable 和代表性的分区数据组成。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #222; }
      .box { fill: #f4f1ff; stroke: #7057b8; stroke-width: 1.5; }
      .group { fill: #fffdf0; stroke: #aaa33a; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .title { font-size: 17px; font-weight: 600; text-anchor: middle; }
      .detail { font-size: 14px; text-anchor: middle; fill: #444; }
      .group-title { font-size: 16px; font-weight: 600; text-anchor: middle; }
      .partition { font-size: 15px; text-anchor: middle; }
      .arrow { stroke: #555; stroke-width: 1.6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="box" x="240" y="15" width="400" height="55" rx="8"/>
  <text class="title" x="440" y="40">ModelFileHeader</text>
  <text class="detail" x="440" y="60">固定文件头：magic / version / length 等</text>

  <line class="arrow" x1="440" y1="70" x2="440" y2="92"/>

  <rect class="box" x="240" y="95" width="400" height="55" rx="8"/>
  <text class="title" x="440" y="120">ModelPartitionTable</text>
  <text class="detail" x="440" y="140">独立分区表：type / offset / size</text>

  <line class="arrow" x1="440" y1="150" x2="440" y2="172"/>

  <rect class="group" x="20" y="175" width="840" height="205" rx="10"/>
  <text class="group-title" x="440" y="202">分区数据（代表性分区）</text>

  <rect class="box" x="45" y="218" width="250" height="48" rx="8"/>
  <text class="partition" x="170" y="248">MODEL_DEF — 模型定义与图属性</text>

  <rect class="box" x="315" y="218" width="250" height="48" rx="8"/>
  <text class="partition" x="440" y="248">WEIGHTS_DATA — 权重数据</text>

  <rect class="box" x="585" y="218" width="250" height="48" rx="8"/>
  <text class="partition" x="710" y="248">TASK_INFO — 执行任务信息</text>

  <rect class="box" x="45" y="288" width="250" height="48" rx="8"/>
  <text class="partition" x="170" y="318">TBE_KERNELS — 算子 kernel 二进制</text>

  <rect class="box" x="315" y="288" width="250" height="48" rx="8"/>
  <text class="partition" x="440" y="318">SO_BINS — 随 OM 打包的算子 .so</text>

  <rect class="box" x="585" y="288" width="250" height="48" rx="8"/>
  <text class="partition" x="710" y="318">TILING_DATA — 预计算 tiling 参数</text>
</svg>
