<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200"
     role="img" aria-labelledby="title desc">
  <title id="title">自定义算子入图端到端链路</title>
  <desc id="desc">自定义算子从工程创建到入图执行的四个阶段。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #222; }
      .box { fill: #f4f1ff; stroke: #7057b8; stroke-width: 1.5; }
      .title { font-size: 15px; font-weight: 600; text-anchor: middle; }
      .detail { font-size: 13px; text-anchor: middle; fill: #444; }
      .arrow { stroke: #555; stroke-width: 1.6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="box" x="10" y="30" width="190" height="140" rx="8"/>
  <text class="title" x="105" y="58">[1] 算子工程</text>
  <text class="detail" x="105" y="88">REG_OP 原型</text>
  <text class="detail" x="105" y="112">REG_AUTO_MAPPING_OP</text>

  <line class="arrow" x1="200" y1="100" x2="225" y2="100"/>

  <rect class="box" x="230" y="30" width="190" height="140" rx="8"/>
  <text class="title" x="325" y="58">[2] 实现能力接口</text>
  <text class="detail" x="325" y="88">EagerExecuteOp / ShapeInferOp</text>
  <text class="detail" x="325" y="112">CompilableOp / PortableOp</text>
  <text class="detail" x="325" y="136">+ kernel 实现</text>

  <line class="arrow" x1="420" y1="100" x2="445" y2="100"/>

  <rect class="box" x="450" y="30" width="190" height="140" rx="8"/>
  <text class="title" x="545" y="58">[3] 编译部署</text>
  <text class="detail" x="545" y="88">cmake → libcust_opapi.so</text>
  <text class="detail" x="545" y="112">安装 OPP 包</text>
  <text class="detail" x="545" y="136">ASCEND_CUSTOM_OPP_PATH</text>

  <line class="arrow" x1="640" y1="100" x2="665" y2="100"/>

  <rect class="box" x="670" y="30" width="220" height="140" rx="8"/>
  <text class="title" x="780" y="58">[4] 入图执行</text>
  <text class="detail" x="780" y="88">在线：构图→GE 编译→执行</text>
  <text class="detail" x="780" y="112">离线：构图→AIR→ATC→OM</text>
  <text class="detail" x="780" y="136">→ACL 加载→执行</text>
</svg>
