<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="280" viewBox="0 0 1300 280"
     role="img" aria-labelledby="title desc">
  <title id="title">Unknown Shape 与 Known Shape 执行单元的处理链路</title>
  <desc id="desc">真实输入进入编译后的执行单元后，Unknown Shape 节点按需执行 InferShape、Tiling、Buffer 获取和 Kernel Launch；Known Shape 子图由静态执行器触发模型任务。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #222; }
      .neutral { fill: #f7f7f8; stroke: #666; stroke-width: 1.5; }
      .dynamic { fill: #f4f1ff; stroke: #7057b8; stroke-width: 1.5; }
      .known { fill: #eef9f1; stroke: #3f8f5f; stroke-width: 1.5; }
      .title-text { font-size: 14px; font-weight: 600; text-anchor: middle; }
      .detail { font-size: 12px; text-anchor: middle; fill: #444; }
      .path-label { font-size: 12px; font-weight: 600; fill: #555; }
      .arrow { fill: none; stroke: #555; stroke-width: 1.6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="neutral" x="10" y="100" width="145" height="80" rx="8"/>
  <text class="title-text" x="82" y="133">真实输入</text>
  <text class="detail" x="82" y="158">带具体 shape</text>

  <line class="arrow" x1="155" y1="140" x2="185" y2="140"/>

  <rect class="neutral" x="190" y="100" width="160" height="80" rx="8"/>
  <text class="title-text" x="270" y="133">编译后的</text>
  <text class="title-text" x="270" y="157">执行单元</text>

  <polyline class="arrow" points="350,123 370,123 370,60 385,60"/>
  <text class="path-label" x="380" y="18">Unknown Shape 节点</text>

  <rect class="dynamic" x="390" y="20" width="165" height="80" rx="8"/>
  <text class="title-text" x="472" y="48">运行期 InferShape</text>
  <text class="detail" x="472" y="72">仅确需动态推导的节点</text>

  <line class="arrow" x1="555" y1="60" x2="570" y2="60"/>

  <rect class="dynamic" x="575" y="20" width="165" height="80" rx="8"/>
  <text class="title-text" x="657" y="48">运行期 Tiling</text>
  <text class="detail" x="657" y="72">仅需要 Tiling 的算子</text>

  <line class="arrow" x1="740" y1="60" x2="755" y2="60"/>

  <rect class="dynamic" x="760" y="20" width="180" height="80" rx="8"/>
  <text class="title-text" x="850" y="48">获取 / 刷新 Buffer</text>
  <text class="detail" x="850" y="72">通常复用缓存池</text>

  <line class="arrow" x1="940" y1="60" x2="955" y2="60"/>

  <rect class="dynamic" x="960" y="20" width="150" height="80" rx="8"/>
  <text class="title-text" x="1035" y="48">Kernel Launch</text>
  <text class="detail" x="1035" y="72">下发到 Device 流</text>

  <line class="arrow" x1="1110" y1="60" x2="1125" y2="60"/>

  <rect class="dynamic" x="1130" y="20" width="155" height="80" rx="8"/>
  <text class="title-text" x="1207" y="48">Device 执行</text>
  <text class="detail" x="1207" y="72">继续拓扑调度</text>

  <polyline class="arrow" points="350,157 390,157 390,220 445,220"/>
  <rect class="known" x="450" y="180" width="180" height="80" rx="8"/>
  <text class="title-text" x="540" y="213">Known Shape 子图</text>
  <text class="detail" x="540" y="238">满足静态执行条件</text>

  <line class="arrow" x1="630" y1="220" x2="675" y2="220"/>

  <rect class="known" x="680" y="180" width="200" height="80" rx="8"/>
  <text class="title-text" x="780" y="213">静态执行器</text>
  <text class="detail" x="780" y="238">模型任务触发</text>

  <line class="arrow" x1="880" y1="220" x2="925" y2="220"/>

  <rect class="known" x="930" y="180" width="190" height="80" rx="8"/>
  <text class="title-text" x="1025" y="213">Device 执行子图</text>
  <text class="detail" x="1025" y="238">无需逐算子 Launch</text>
</svg>
