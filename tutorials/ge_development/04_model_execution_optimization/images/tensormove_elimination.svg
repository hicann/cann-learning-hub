<svg xmlns="http://www.w3.org/2000/svg" width="680" height="160" viewBox="0 0 680 160"
     role="img" aria-labelledby="title desc">
  <title id="title">TensorMove 消除</title>
  <desc id="desc">优化前 op1→TensorMove→op2，优化后 op1 直连 op2。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #222; }
      .box { fill: #f4f1ff; stroke: #7057b8; stroke-width: 1.5; }
      .group { fill: #fffdf0; stroke: #aaa33a; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .detail { font-size: 13px; text-anchor: middle; fill: #444; }
      .group-title { font-size: 15px; font-weight: 600; text-anchor: middle; }
      .arrow { stroke: #555; stroke-width: 1.6; marker-end: url(#arrow); }
      .note { font-size: 11px; text-anchor: middle; fill: #888; }
    </style>
  </defs>

  <!-- 左侧：优化前 -->
  <rect class="group" x="10" y="10" width="300" height="140" rx="10"/>
  <text class="group-title" x="160" y="35">优化前</text>

  <rect class="box" x="30" y="55" width="70" height="36" rx="8"/>
  <text class="detail" x="65" y="78">op1</text>

  <line class="arrow" x1="100" y1="73" x2="125" y2="73"/>

  <rect class="box" x="130" y="55" width="100" height="36" rx="8"/>
  <text class="detail" x="180" y="78">TensorMove</text>

  <line class="arrow" x1="230" y1="73" x2="255" y2="73"/>

  <rect class="box" x="260" y="55" width="35" height="36" rx="8"/>
  <text class="detail" x="277" y="78">op2</text>

  <!-- 右侧：优化后 -->
  <rect class="group" x="370" y="10" width="300" height="140" rx="10"/>
  <text class="group-title" x="520" y="35">优化后</text>

  <rect class="box" x="400" y="55" width="70" height="36" rx="8"/>
  <text class="detail" x="435" y="78">op1</text>

  <line class="arrow" x1="470" y1="73" x2="530" y2="73"/>
  <text class="note" x="500" y="52" style="font-size:9px">直连，省掉拷贝</text>

  <rect class="box" x="535" y="55" width="70" height="36" rx="8"/>
  <text class="detail" x="570" y="78">op2</text>
</svg>
