<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <text x="460" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#24292f">FlashAttention 计算流程 与 昇腾硬件单元的对应关系</text>
  <!-- left: FA pipeline -->
  <rect x="40" y="60" width="300" height="60" rx="8" fill="#e8f1fb" stroke="#2f6fb5" stroke-width="2"/>
  <text x="190" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a4c8b">① QK^T 矩阵乘（打分）</text>
  <text x="190" y="105" text-anchor="middle" font-size="11" fill="#555">S = Q · K^T · scale</text>
  <rect x="40" y="180" width="300" height="60" rx="8" fill="#eaf6ec" stroke="#3d8b53" stroke-width="2"/>
  <text x="190" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#216639">② Online Softmax（归一化）</text>
  <text x="190" y="225" text-anchor="middle" font-size="11" fill="#555">行 Max / 行 Sum / Exp / Rescale</text>
  <rect x="40" y="300" width="300" height="60" rx="8" fill="#e8f1fb" stroke="#2f6fb5" stroke-width="2"/>
  <text x="190" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a4c8b">③ P·V 矩阵乘（加权求和）</text>
  <text x="190" y="345" text-anchor="middle" font-size="11" fill="#555">O 累加 + 最终归一化</text>
  <!-- middle arrows -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#5b6b7c"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7a3fb5"/></marker>
  </defs>
  <line x1="190" y1="120" x2="190" y2="178" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="190" y1="240" x2="190" y2="298" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="340" y1="90" x2="560" y2="90" stroke="#7a3fb5" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrb)"/>
  <line x1="340" y1="210" x2="560" y2="210" stroke="#7a3fb5" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrb)"/>
  <line x1="340" y1="330" x2="560" y2="330" stroke="#7a3fb5" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrb)"/>
  <!-- right: hardware units -->
  <rect x="560" y="55" width="320" height="70" rx="8" fill="#f5ecfb" stroke="#7a3fb5" stroke-width="2"/>
  <text x="720" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#5a2d8b">Cube Core（矩阵计算单元）</text>
  <text x="720" y="100" text-anchor="middle" font-size="11" fill="#555">mmad 矩阵乘指令 · L0A/L0B → L0C</text>
  <rect x="560" y="175" width="320" height="70" rx="8" fill="#fdf3e3" stroke="#c58a1e" stroke-width="2"/>
  <text x="720" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a5a00">Vector Core（向量计算单元）</text>
  <text x="720" y="220" text-anchor="middle" font-size="11" fill="#555">向量指令 · 逐元素 / 归约 · UB 上计算</text>
  <rect x="560" y="295" width="320" height="70" rx="8" fill="#f5ecfb" stroke="#7a3fb5" stroke-width="2"/>
  <text x="720" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#5a2d8b">Cube Core（矩阵计算单元）</text>
  <text x="720" y="340" text-anchor="middle" font-size="11" fill="#555">②③ 之间的 rescale 由 Vector 完成</text>
  <!-- bottom note -->
  <rect x="40" y="380" width="840" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="460" y="400" text-anchor="middle" font-size="12" fill="#57606a">两次 Cube 密集计算夹一段 Vector 密集计算 —— Cube:Vector 算力配比（约 8:1）决定了 FA 的性能调优方向</text>
</svg>
