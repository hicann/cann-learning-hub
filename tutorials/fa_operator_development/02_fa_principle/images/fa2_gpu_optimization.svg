      <rect x="824" y="105" width="22" height="22" fill="#3EAA8C" fill-opacity="0.65" stroke="#2C8168"/>
      <rect x="560" y="129" width="22" height="22" fill="#3EAA8C" fill-opacity="0.65" stroke="#2C8168"/>
      <rect x="584" y="129" width="22" height="22" fill="#3EAA8C" fill-opacity="0.65" stroke="#2C8168"/>
      <rect x="608" y="129" width="22" height="22" fill="#3EAA8C" fill-opacity="0.65" stroke="#2C8168"/>
      <rect x="632" y="129" width="22" height="22" fill="#3EAA8C" fill-opacity="0.65" stroke="#2C8168"/>
      <rect x="656" y="129" width="22" height="22" fill="#3EAA8C" fill-opacity="0.65" stroke="#2C8168"/>
      <rect x="680" y="129" width="22" height="22" fill="#3EAA8C" fill-opacity="0.65" stroke="#2C8168"/>
      <rect x="704" y="129" width="22" height="22" fill="#3EAA8C" fill-opacity="0.65" stroke="#2C8168"/>
      <rect x="728" y="129" width="22" height="22" fill="#3EAA8C" fill-opacity="0.65" stroke="#2C8168"/>
      <rect x="752" y="129" width="22" height="22" fill="#3EAA8C" fill-opacity="0.65" stroke="#2C8168"/>
      <rect x="776" y="129" width="22" height="22" fill="#3EAA8C" fill-opacity="0.65" stroke="#2C8168"/>
      <rect x="800" y="129" width="22" height="22" fill="#3EAA8C" fill-opacity="0.65" stroke="#2C8168"/>
      <rect x="824" y="129" width="22" height="22" fill="#3EAA8C" fill-opacity="0.65" stroke="#2C8168"/>
      <rect x="560" y="153" width="22" height="22" fill="#3EAA8C" fill-opacity="0.65" stroke="#2C8168"/>
      <rect x="584" y="153" width="22" height="22" fill="#3EAA8C" fill-opacity="0.65" stroke="#2C8168"/>
      <rect x="608" y="153" width="22" height="22" fill="#3EAA8C" fill-opacity="0.65" stroke="#2C8168"/>
      <rect x="632" y="153" width="22" height="22" fill="#3EAA8C" fill-opacity="0.65" stroke="#2C8168"/>
      <rect x="656" y="153" width="22" height="22" fill="#3EAA8C" fill-opacity="0.65" stroke="#2C8168"/>
      <rect x="680" y="153" width="22" height="22" fill="#3EAA8C" fill-opacity="0.65" stroke="#2C8168"/>
      <rect x="704" y="153" width="22" height="22" fill="#3EAA8C" fill-opacity="0.65" stroke="#2C8168"/>
      <rect x="728" y="153" width="22" height="22" fill="#3EAA8C" fill-opacity="0.65" stroke="#2C8168"/>
      <rect x="752" y="153" width="22" height="22" fill="#3EAA8C" fill-opacity="0.65" stroke="#2C8168"/>
