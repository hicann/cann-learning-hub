    <text x="700" y="203" text-anchor="middle" font-size="11.5" fill="#166B54" font-weight="bold">Decode（GQA、Q 只有 1 行）场景尤其受益</text>
  </g>

  <!-- ============ 下半：warp 分工 ============ -->
  <text x="470" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">手术三：线程块内 4 个 Warp 的切分方式（以 128 行 Q 块、d=128 为例）</text>

  <!-- V1 warp -->
  <g>
    <text x="235" y="278" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8A5500">V1：按缩减维 K（d=128）切 4 份，每 Warp 算 32 维的部分和</text>
    <rect x="60" y="292" width="350" height="130" rx="10" fill="#FFF8E6" stroke="#E0A800" stroke-width="1.5"/>
    <!-- 4 warp 条 -->
    <g font-size="11">
      <rect x="80" y="306" width="120" height="24" rx="4" fill="#E0A800" fill-opacity="0.5" stroke="#B58500"/>
      <text x="140" y="322" text-anchor="middle" fill="#8A5500">Warp0：S 的 0~31 列</text>
      <rect x="80" y="336" width="120" height="24" rx="4" fill="#E0A800" fill-opacity="0.5" stroke="#B58500"/>
      <text x="140" y="352" text-anchor="middle" fill="#8A5500">Warp1：32~63 列</text>
      <rect x="80" y="366" width="120" height="24" rx="4" fill="#E0A800" fill-opacity="0.5" stroke="#B58500"/>
      <text x="140" y="382" text-anchor="middle" fill="#8A5500">Warp2：64~95 列</text>
      <rect x="80" y="396" width="120" height="24" rx="4" fill="#E0A800" fill-opacity="0.5" stroke="#B58500"/>
      <text x="140" y="412" text-anchor="middle" fill="#8A5500">Warp3：96~127 列</text>
      <!-- 通信箭头 -->
      <path d="M 210 318 C 250 318 250 348 210 348" fill="none" stroke="#E8446D" stroke-width="1.6" marker-end="url(#arrowT)"/>
      <path d="M 210 378 C 250 378 250 408 210 408" fill="none" stroke="#E8446D" stroke-width="1.6" marker-end="url(#arrowT)"/>
      <path d="M 210 408 C 260 408 260 318 210 318" fill="none" stroke="#E8446D" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrowT)"/>
      <text x="310" y="350" text-anchor="middle" font-size="11" fill="#A81640" font-weight="bold">rowmax / rowsum</text>
      <text x="310" y="366" text-anchor="middle" font-size="11" fill="#A81640">必须跨 Warp 归约</text>
      <text x="310" y="382" text-anchor="middle" font-size="11" fill="#A81640">（共享内存 + 同步）</text>
    </g>
  </g>

  <!-- V2 warp -->
  <g>
    <text x="705" y="278" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166B54">V2：按 Q 的行切 4 份，每 Warp 独占 32 行</text>
    <rect x="530" y="292" width="350" height="130" rx="10" fill="#3EAA8C" fill-opacity="0.1" stroke="#3EAA8C" stroke-width="1.5"/>
    <g font-size="11">
      <rect x="550" y="306" width="150" height="24" rx="4" fill="#3EAA8C" fill-opacity="0.4" stroke="#2C8168"/>
      <text x="625" y="322" text-anchor="middle" fill="#166B54">Warp0：Q 第 0~31 行</text>
      <rect x="550" y="336" width="150" height="24" rx="4" fill="#3EAA8C" fill-opacity="0.4" stroke="#2C8168"/>
      <text x="625" y="352" text-anchor="middle" fill="#166B54">Warp1：Q 第 32~63 行</text>
      <rect x="550" y="366" width="150" height="24" rx="4" fill="#3EAA8C" fill-opacity="0.4" stroke="#2C8168"/>
      <text x="625" y="382" text-anchor="middle" fill="#166B54">Warp2：Q 第 64~95 行</text>
      <rect x="550" y="396" width="150" height="24" rx="4" fill="#3EAA8C" fill-opacity="0.4" stroke="#2C8168"/>
      <text x="625" y="412" text-anchor="middle" fill="#166B54">Warp3：Q 第 96~127 行</text>
      <text x="775" y="335" text-anchor="middle" font-size="11" fill="#166B54" font-weight="bold">每 Warp 私有</text>
      <text x="775" y="351" text-anchor="middle" font-size="11" fill="#166B54">自己的 m / l / O</text>
      <text x="775" y="375" text-anchor="middle" font-size="11" fill="#166B54">K / V 广播共享</text>
      <text x="775" y="391" text-anchor="middle" font-size="11" fill="#166B54" font-weight="bold">零跨 Warp 通信</text>
    </g>
  </g>

  <!-- 底部结论 -->
  <rect x="80" y="448" width="800" height="76" rx="10" fill="#FAFAFA" stroke="#CCC" stroke-width="1.2"/>
  <text x="480" y="476" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">三个手术的合力：A100 前向达到理论峰值（SOL）的 50%~73%，比 V1 快约 2 倍</text>
  <text x="480" y="502" text-anchor="middle" font-size="12" fill="#888">昇腾视角：Q 块并行 ↔ 分核策略（第 5/9 章）；non-matmul 少 ↔ Vector 单元负载（第 8 章）；状态私有 ↔ Cube/Vector 流水（第 1 章）</text>
</svg>
