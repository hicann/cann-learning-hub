      <rect x="315" y="153" width="22" height="22" fill="#F5F5F5" stroke="#CCC"/>
      <rect x="339" y="153" width="22" height="22" fill="#F5F5F5" stroke="#CCC"/>
    </g>
    <text x="215" y="203" text-anchor="middle" font-size="11.5" fill="#A81640" font-weight="bold">占用率 ≈ 7%，长序列小 batch 场景算力大量闲置</text>
  </g>

  <!-- FA2 SM 阵列 -->
  <g>
    <text x="700" y="92" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166B54">V2：任务数 = 8 × 256 = 2048，远超 108 → 全亮</text>
    <g>
      <rect x="560" y="105" width="22" height="22" fill="#3EAA8C" fill-opacity="0.65" stroke="#2C8168"/>
      <rect x="584" y="105" width="22" height="22" fill="#3EAA8C" fill-opacity="0.65" stroke="#2C8168"/>
      <rect x="608" y="105" width="22" height="22" fill="#3EAA8C" fill-opacity="0.65" stroke="#2C8168"/>
      <rect x="632" y="105" width="22" height="22" fill="#3EAA8C" fill-opacity="0.65" stroke="#2C8168"/>
      <rect x="656" y="105" width="22" height="22" fill="#3EAA8C" fill-opacity="0.65" stroke="#2C8168"/>
      <rect x="680" y="105" width="22" height="22" fill="#3EAA8C" fill-opacity="0.65" stroke="#2C8168"/>
      <rect x="704" y="105" width="22" height="22" fill="#3EAA8C" fill-opacity="0.65" stroke="#2C8168"/>
      <rect x="728" y="105" width="22" height="22" fill="#3EAA8C" fill-opacity="0.65" stroke="#2C8168"/>
      <rect x="752" y="105" width="22" height="22" fill="#3EAA8C" fill-opacity="0.65" stroke="#2C8168"/>
