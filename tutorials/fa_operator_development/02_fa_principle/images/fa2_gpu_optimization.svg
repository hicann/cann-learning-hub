  <!-- FA1 SM 阵列 -->
  <g>
    <text x="215" y="92" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8A5500">V1：任务数 = 8（B×H），108 个 SM 只亮 8 个</text>
    <!-- 12x3 格子 -->
    <g>
      <!-- 用少量亮格 + 多数暗格 -->
      <rect x="75" y="105" width="22" height="22" fill="#E0A800" fill-opacity="0.6" stroke="#B58500"/>
