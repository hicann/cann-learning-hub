<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <text x="470" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Transformer：从 2017 的 Encoder-Decoder，到今天大模型的 Decoder-Only</text>

  <!-- ================= 左半：原始 Transformer ================= -->
  <text x="240" y="66" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#444">原版 Transformer（2017，机器翻译）</text>

  <!-- Encoder 栈 -->
  <g>
    <rect x="60" y="200" width="170" height="200" rx="10" fill="#E8F1FE" stroke="#4C88F7" stroke-width="1.8"/>
    <text x="145" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#1B4E9B">Encoder × N</text>
    <rect x="80" y="236" width="130" height="32" rx="5" fill="#FDE8E8" stroke="#E8446D" stroke-width="1.4"/>
    <text x="145" y="257" text-anchor="middle" font-size="12" fill="#A81640" font-weight="bold">Self-Attention</text>
    <text x="145" y="274" text-anchor="middle" font-size="10.5" fill="#888">Add &amp; LayerNorm</text>
    <rect x="80" y="286" width="130" height="32" rx="5" fill="#E8F1FE" stroke="#4C88F7" stroke-width="1.4"/>
    <text x="145" y="307" text-anchor="middle" font-size="12" fill="#1B4E9B" font-weight="bold">FFN</text>
    <text x="145" y="324" text-anchor="middle" font-size="10.5" fill="#888">Add &amp; LayerNorm</text>
    <text x="145" y="362" text-anchor="middle" font-size="11" fill="#666">每个词看到所有词</text>
  </g>

  <!-- Decoder 栈 -->
  <g>
    <rect x="270" y="200" width="180" height="200" rx="10" fill="#FFF8E6" stroke="#E0A800" stroke-width="1.8"/>
    <text x="360" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#8A5500">Decoder × N</text>
    <rect x="288" y="236" width="144" height="32" rx="5" fill="#FDE8E8" stroke="#E8446D" stroke-width="1.4"/>
    <text x="360" y="251" text-anchor="middle" font-size="11.5" fill="#A81640" font-weight="bold">Masked Self-Attention</text>
    <text x="360" y="264" text-anchor="middle" font-size="9.5" fill="#A81640">只许看过去，不许看未来</text>
    <rect x="288" y="276" width="144" height="32" rx="5" fill="#FDE8E8" stroke="#E8446D" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="360" y="291" text-anchor="middle" font-size="11.5" fill="#A81640" font-weight="bold">Cross-Attention</text>
    <text x="360" y="304" text-anchor="middle" font-size="9.5" fill="#A81640">Q 来自译文，K/V 来自原文</text>
    <rect x="288" y="316" width="144" height="32" rx="5" fill="#E8F1FE" stroke="#4C88F7" stroke-width="1.4"/>
    <text x="360" y="337" text-anchor="middle" font-size="12" fill="#1B4E9B" font-weight="bold">FFN</text>
    <text x="360" y="378" text-anchor="middle" font-size="11" fill="#666">逐词自回归生成</text>
  </g>
  <line x1="232" y1="300" x2="266" y2="300" stroke="#555" stroke-width="1.8" marker-end="url(#arrowT)"/>
  <text x="249" y="290" text-anchor="middle" font-size="10" fill="#888">记忆</text>

  <!-- Decoder 输入输出 -->
  <rect x="270" y="440" width="180" height="34" rx="8" fill="#F2F2F2" stroke="#999"/>
  <text x="360" y="462" text-anchor="middle" font-size="12" fill="#555">已生成的词（右移一位）</text>
  <rect x="60" y="440" width="170" height="34" rx="8" fill="#F2F2F2" stroke="#999"/>
  <text x="145" y="462" text-anchor="middle" font-size="12" fill="#555">源语言句子</text>
  <line x1="360" y1="436" x2="360" y2="404" stroke="#555" stroke-width="1.8" marker-end="url(#arrowT)"/>
  <line x1="145" y1="436" x2="145" y2="404" stroke="#555" stroke-width="1.8" marker-end="url(#arrowT)"/>
  <rect x="270" y="158" width="180" height="30" rx="8" fill="#3EAA8C" fill-opacity="0.16" stroke="#3EAA8C"/>
  <text x="360" y="178" text-anchor="middle" font-size="12" fill="#166B54" font-weight="bold">Linear + Softmax → 下一个词</text>
  <line x1="360" y1="196" x2="360" y2="188" stroke="#555" stroke-width="1.8" marker-end="url(#arrowT)"/>

  <!-- Embedding 说明 -->
  <text x="240" y="500" text-anchor="middle" font-size="11.5" fill="#888">两路输入都先做 Embedding + 位置编码（Attention 本身不感知顺序）</text>
  <text x="240" y="522" text-anchor="middle" font-size="11.5" fill="#A81640" font-weight="bold">粉色块 = Attention：全楼里唯一 O(n²) 复杂度的部件</text>

  <!-- ================= 右半：Decoder-Only ================= -->
  <line x1="490" y1="60" x2="490" y2="540" stroke="#DDD" stroke-width="1.5"/>
  <text x="715" y="66" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#444">现代大模型（GPT / Llama / DeepSeek）</text>

  <!-- 输入 -->
  <rect x="600" y="470" width="230" height="36" rx="8" fill="#A8C7E8" stroke="#1B4E9B" stroke-width="1.5"/>
  <text x="715" y="493" text-anchor="middle" font-size="12.5" fill="#1B4E9B" font-weight="bold">Tokens：『今天 天气 真 不错』</text>

  <line x1="715" y1="466" x2="715" y2="440" stroke="#555" stroke-width="1.8" marker-end="url(#arrowT)"/>
  <rect x="625" y="406" width="180" height="34" rx="8" fill="#E8F1FE" stroke="#4C88F7" stroke-width="1.4"/>
  <text x="715" y="428" text-anchor="middle" font-size="12" fill="#1B4E9B">Embedding + 位置编码（RoPE）</text>

  <!-- Block 堆叠 -->
  <line x1="715" y1="402" x2="715" y2="372" stroke="#555" stroke-width="1.8" marker-end="url(#arrowT)"/>
  <g>
    <rect x="600" y="150" width="230" height="218" rx="10" fill="#FFF8E6" stroke="#E0A800" stroke-width="1.8"/>
    <text x="715" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#8A5500">Decoder Block × N（N = 32 ~ 100+）</text>
    <rect x="620" y="188" width="190" height="44" rx="6" fill="#FDE8E8" stroke="#E8446D" stroke-width="1.5"/>
    <text x="715" y="207" text-anchor="middle" font-size="12" fill="#A81640" font-weight="bold">Masked Self-Attention</text>
    <text x="715" y="224" text-anchor="middle" font-size="10" fill="#A81640">FA 算子的主战场 → 本课程全部主题</text>
    <text x="715" y="242" text-anchor="middle" font-size="10" fill="#888">RMSNorm + 残差</text>
    <rect x="620" y="254" width="190" height="44" rx="6" fill="#E8F1FE" stroke="#4C88F7" stroke-width="1.5"/>
    <text x="715" y="273" text-anchor="middle" font-size="12" fill="#1B4E9B" font-weight="bold">FFN（SwiGLU 升维 ~4× 再降维）</text>
    <text x="715" y="290" text-anchor="middle" font-size="10" fill="#666">DeepSeek 等换成 MoE 专家</text>
    <text x="715" y="308" text-anchor="middle" font-size="10" fill="#888">RMSNorm + 残差</text>
    <text x="715" y="342" text-anchor="middle" font-size="11" fill="#666">一块 = 参数 ~10⁸ 量级，重复即得 7B ~ 700B</text>
  </g>

  <line x1="715" y1="146" x2="715" y2="122" stroke="#555" stroke-width="1.8" marker-end="url(#arrowT)"/>
  <rect x="625" y="88" width="180" height="34" rx="8" fill="#3EAA8C" fill-opacity="0.16" stroke="#3EAA8C" stroke-width="1.5"/>
  <text x="715" y="110" text-anchor="middle" font-size="12.5" fill="#166B54" font-weight="bold">RMSNorm → LM Head → 下一个 token</text>

  <!-- 自回归循环 -->
  <path d="M 815 105 C 900 105 900 488 812 488" fill="none" stroke="#3EAA8C" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowT)"/>
  <text x="905" y="300" text-anchor="middle" font-size="11" fill="#166B54" transform="rotate(90 905 300)">预测出的 token 拼回输入，循环生成（自回归）</text>

  <text x="715" y="530" text-anchor="middle" font-size="11.5" fill="#888">砍掉 Encoder 与 Cross-Attention，只剩一个方块 → 规模化的基石</text>
</svg>
