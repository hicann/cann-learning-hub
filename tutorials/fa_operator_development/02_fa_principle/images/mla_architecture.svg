<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <text x="470" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">MLA（DeepSeek）：低秩压缩 + RoPE 解耦，把 KV Cache 再砍一个数量级</text>

  <!-- ===== 左：MHA 每 token 缓存 ===== -->
  <g>
    <text x="160" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#8A5500">MHA / GQA：每个 token、每层缓存</text>
    <rect x="45" y="78" width="230" height="120" rx="10" fill="#FFF8E6" stroke="#E0A800" stroke-width="1.6"/>
    <text x="160" y="102" text-anchor="middle" font-size="11.5" fill="#8A5500">K、V 各 n_h × d_h 个数</text>
    <text x="160" y="126" text-anchor="middle" font-size="12" fill="#A81640" font-weight="bold">2 × 128 头 × 128 维 = 32768 个数</text>
    <text x="160" y="150" text-anchor="middle" font-size="11" fill="#888">（DeepSeek-V2 头配置）</text>
    <text x="160" y="178" text-anchor="middle" font-size="11" fill="#666">fp16 ≈ 64 KB / token / 层</text>
  </g>

  <!-- 中间箭头 -->
  <line x1="285" y1="138" x2="325" y2="138" stroke="#3EAA8C" stroke-width="2.5" marker-end="url(#arrowT)"/>
  <text x="305" y="125" text-anchor="middle" font-size="10.5" fill="#166B54">压缩</text>

  <!-- ===== 中：MLA 压缩通路 ===== -->
  <g>
    <text x="600" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#166B54">MLA：只缓存压缩后的潜在向量 c_t</text>
    <rect x="340" y="78" width="520" height="120" rx="10" fill="#3EAA8C" fill-opacity="0.1" stroke="#3EAA8C" stroke-width="1.6"/>

    <rect x="360" y="94" width="130" height="34" rx="6" fill="#4C88F7" fill-opacity="0.3" stroke="#4C88F7"/>
    <text x="425" y="116" text-anchor="middle" font-size="11.5" fill="#1B4E9B">h_t（d_model 维）</text>

    <line x1="492" y1="111" x2="518" y2="111" stroke="#555" stroke-width="1.6" marker-end="url(#arrowT)"/>
    <text x="505" y="100" text-anchor="middle" font-size="9.5" fill="#888">下投影</text>

    <rect x="520" y="94" width="170" height="34" rx="6" fill="#34A853" fill-opacity="0.35" stroke="#34A853" stroke-width="1.5"/>
    <text x="605" y="110" text-anchor="middle" font-size="11.5" fill="#1E6B34" font-weight="bold">c_t（d_c = 512 维）</text>
    <text x="605" y="124" text-anchor="middle" font-size="9.5" fill="#1E6B34">★ KV Cache 只存它 + 少量 RoPE 部分</text>

    <line x1="692" y1="111" x2="716" y2="111" stroke="#555" stroke-width="1.6" marker-end="url(#arrowT)"/>
    <text x="704" y="100" text-anchor="middle" font-size="9.5" fill="#888">上投影</text>
    <rect x="718" y="94" width="124" height="34" rx="6" fill="#FDE8E8" stroke="#E8446D"/>
    <text x="780" y="110" text-anchor="middle" font-size="11" fill="#A81640">k_i / v_i（每头 128 维）</text>
    <text x="780" y="124" text-anchor="middle" font-size="9.5" fill="#A81640">用时才展开</text>

    <text x="600" y="152" text-anchor="middle" font-size="11" fill="#166B54">每 token 每层缓存：512 + 64（RoPE 通道）= 576 个数</text>
    <text x="600" y="172" text-anchor="middle" font-size="11.5" fill="#166B54" font-weight="bold">压缩比 ≈ 32768 / 576 ≈ 57×</text>
  </g>

  <!-- ===== 下方：RoPE 解耦与吸收 ===== -->
  <text x="470" y="236" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#444">两个工程细节（昇腾 FA 算子接口中 query_rope / key_rope 参数的由来）</text>

  <!-- RoPE 解耦 -->
  <g>
    <rect x="55" y="256" width="410" height="150" rx="10" fill="#FAFAFA" stroke="#CCC" stroke-width="1.3"/>
    <text x="260" y="280" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#444">细节一：RoPE 解耦</text>
    <text x="260" y="305" text-anchor="middle" font-size="11" fill="#666">RoPE 位置编码是「旋转」，与低秩压缩不交换</text>
    <text x="260" y="330" text-anchor="middle" font-size="11" fill="#666">→ K 拆成两段拼接：</text>
    <text x="260" y="356" text-anchor="middle" font-size="11.5" fill="#A81640" font-weight="bold">k = [ kⁿᵒᵖᵉ（512 维，走压缩通路） ； kᵗᵒᵖᵉ（64 维，单独投影） ]</text>
    <text x="260" y="382" text-anchor="middle" font-size="10.5" fill="#888">位置相关的 64 维小通道单独缓存，其余走 c_t</text>
  </g>

  <!-- 权重吸收 -->
  <g>
    <rect x="490" y="256" width="410" height="150" rx="10" fill="#FAFAFA" stroke="#CCC" stroke-width="1.3"/>
    <text x="695" y="280" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#444">细节二：上投影「吸收」进 Q 侧</text>
    <text x="695" y="307" text-anchor="middle" font-size="11.5" fill="#1E6B34" font-family="Consolas, monospace">q·(W_UK · c) = (W_UKᵀ · q) · c</text>
    <text x="695" y="332" text-anchor="middle" font-size="11" fill="#666">推理时不必显式展开 k_i / v_i</text>
    <text x="695" y="356" text-anchor="middle" font-size="11" fill="#666">把 W_UKᵀ 预乘进 q，点积直接打在 512 维的 c_t 上</text>
    <text x="695" y="382" text-anchor="middle" font-size="10.5" fill="#888">K=512 远小于 n_h×d_h，GEMM 还变小了</text>
  </g>

  <!-- 底部结论 -->
  <rect x="55" y="428" width="845" height="110" rx="10" fill="#E8F1FE" stroke="#4C88F7" stroke-width="1.4" fill-opacity="0.5"/>
  <text x="477" y="452" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1B4E9B">账单（DeepSeek-V2 量级，60 层，128k 序列，fp8 缓存）</text>
  <text x="477" y="478" text-anchor="middle" font-size="11.5" fill="#666">MHA：~245 GB　→　MLA：~4.3 GB（每 token 每层 576 个数 × 60 层 × 128k token）</text>
  <text x="477" y="502" text-anchor="middle" font-size="11.5" fill="#166B54" font-weight="bold">代价：Q/K/V 的投影结构变成低秩两段式，Attention 算子必须原生支持 MLA 形态</text>
  <text x="477" y="524" text-anchor="middle" font-size="11" fill="#888">昇腾 FusedInferAttentionScore 提供 query_rope / key_rope 独立入参，正是为 MLA 铺路</text>
</svg>
