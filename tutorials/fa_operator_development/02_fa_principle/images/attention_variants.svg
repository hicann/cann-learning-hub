<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <text x="470" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">MHA → MQA → GQA：KV 头的共享拓扑与 KV Cache 账单</text>

  <!-- ===== MHA ===== -->
  <g>
    <text x="160" y="62" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1B4E9B">MHA（标准多头）</text>
    <!-- Q heads -->
    <g font-size="10.5" fill="#1B4E9B">
      <rect x="60" y="80" width="40" height="24" rx="4" fill="#4C88F7" fill-opacity="0.5" stroke="#4C88F7"/><text x="80" y="96" text-anchor="middle">Q0</text>
      <rect x="110" y="80" width="40" height="24" rx="4" fill="#4C88F7" fill-opacity="0.5" stroke="#4C88F7"/><text x="130" y="96" text-anchor="middle">Q1</text>
      <rect x="160" y="80" width="40" height="24" rx="4" fill="#4C88F7" fill-opacity="0.5" stroke="#4C88F7"/><text x="180" y="96" text-anchor="middle">Q2</text>
      <rect x="210" y="80" width="40" height="24" rx="4" fill="#4C88F7" fill-opacity="0.5" stroke="#4C88F7"/><text x="230" y="96" text-anchor="middle">Q3</text>
      <rect x="60" y="112" width="40" height="24" rx="4" fill="#4C88F7" fill-opacity="0.5" stroke="#4C88F7"/><text x="80" y="128" text-anchor="middle">Q4</text>
      <rect x="110" y="112" width="40" height="24" rx="4" fill="#4C88F7" fill-opacity="0.5" stroke="#4C88F7"/><text x="130" y="128" text-anchor="middle">Q5</text>
      <rect x="160" y="112" width="40" height="24" rx="4" fill="#4C88F7" fill-opacity="0.5" stroke="#4C88F7"/><text x="180" y="128" text-anchor="middle">Q6</text>
      <rect x="210" y="112" width="40" height="24" rx="4" fill="#4C88F7" fill-opacity="0.5" stroke="#4C88F7"/><text x="230" y="128" text-anchor="middle">Q7</text>
    </g>
    <!-- KV heads -->
    <g font-size="10.5" fill="#1E6B34">
      <rect x="60" y="200" width="40" height="24" rx="4" fill="#34A853" fill-opacity="0.45" stroke="#34A853"/><text x="80" y="216" text-anchor="middle">KV0</text>
      <rect x="110" y="200" width="40" height="24" rx="4" fill="#34A853" fill-opacity="0.45" stroke="#34A853"/><text x="130" y="216" text-anchor="middle">KV1</text>
      <rect x="160" y="200" width="40" height="24" rx="4" fill="#34A853" fill-opacity="0.45" stroke="#34A853"/><text x="180" y="216" text-anchor="middle">KV2</text>
      <rect x="210" y="200" width="40" height="24" rx="4" fill="#34A853" fill-opacity="0.45" stroke="#34A853"/><text x="230" y="216" text-anchor="middle">KV3</text>
      <rect x="60" y="232" width="40" height="24" rx="4" fill="#34A853" fill-opacity="0.45" stroke="#34A853"/><text x="80" y="248" text-anchor="middle">KV4</text>
      <rect x="110" y="232" width="40" height="24" rx="4" fill="#34A853" fill-opacity="0.45" stroke="#34A853"/><text x="130" y="248" text-anchor="middle">KV5</text>
      <rect x="160" y="232" width="40" height="24" rx="4" fill="#34A853" fill-opacity="0.45" stroke="#34A853"/><text x="180" y="248" text-anchor="middle">KV6</text>
      <rect x="210" y="232" width="40" height="24" rx="4" fill="#34A853" fill-opacity="0.45" stroke="#34A853"/><text x="230" y="248" text-anchor="middle">KV7</text>
    </g>
    <!-- 连线 -->
    <g stroke="#999" stroke-width="1">
      <line x1="80" y1="104" x2="80" y2="200"/><line x1="130" y1="104" x2="130" y2="200"/>
      <line x1="180" y1="104" x2="180" y2="200"/><line x1="230" y1="104" x2="230" y2="200"/>
      <line x1="80" y1="136" x2="80" y2="232" stroke-dasharray="none"/>
      <line x1="130" y1="136" x2="130" y2="232"/><line x1="180" y1="136" x2="180" y2="232"/><line x1="230" y1="136" x2="230" y2="232"/>
    </g>
    <text x="160" y="292" text-anchor="middle" font-size="11.5" fill="#666">缓存 8 组 KV</text>
    <text x="160" y="312" text-anchor="middle" font-size="11.5" fill="#A81640" font-weight="bold">KV Cache：100%</text>
    <text x="160" y="332" text-anchor="middle" font-size="10.5" fill="#888">质量基准（Llama2-7B 等）</text>
  </g>

  <!-- ===== MQA ===== -->
  <g>
    <text x="470" y="62" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8A5500">MQA（多查询）</text>
    <g font-size="10.5" fill="#1B4E9B">
      <rect x="370" y="80" width="40" height="24" rx="4" fill="#4C88F7" fill-opacity="0.5" stroke="#4C88F7"/><text x="390" y="96" text-anchor="middle">Q0</text>
      <rect x="420" y="80" width="40" height="24" rx="4" fill="#4C88F7" fill-opacity="0.5" stroke="#4C88F7"/><text x="440" y="96" text-anchor="middle">Q1</text>
      <rect x="470" y="80" width="40" height="24" rx="4" fill="#4C88F7" fill-opacity="0.5" stroke="#4C88F7"/><text x="490" y="96" text-anchor="middle">Q2</text>
      <rect x="520" y="80" width="40" height="24" rx="4" fill="#4C88F7" fill-opacity="0.5" stroke="#4C88F7"/><text x="540" y="96" text-anchor="middle">Q3</text>
      <rect x="370" y="112" width="40" height="24" rx="4" fill="#4C88F7" fill-opacity="0.5" stroke="#4C88F7"/><text x="390" y="128" text-anchor="middle">Q4</text>
      <rect x="420" y="112" width="40" height="24" rx="4" fill="#4C88F7" fill-opacity="0.5" stroke="#4C88F7"/><text x="440" y="128" text-anchor="middle">Q5</text>
      <rect x="470" y="112" width="40" height="24" rx="4" fill="#4C88F7" fill-opacity="0.5" stroke="#4C88F7"/><text x="490" y="128" text-anchor="middle">Q6</text>
      <rect x="520" y="112" width="40" height="24" rx="4" fill="#4C88F7" fill-opacity="0.5" stroke="#4C88F7"/><text x="540" y="128" text-anchor="middle">Q7</text>
    </g>
    <g font-size="10.5" fill="#1E6B34">
      <rect x="435" y="216" width="50" height="26" rx="4" fill="#34A853" fill-opacity="0.45" stroke="#34A853" stroke-width="1.5"/>
      <text x="460" y="234" text-anchor="middle" font-weight="bold">KV0</text>
    </g>
    <g stroke="#999" stroke-width="1">
      <line x1="390" y1="104" x2="452" y2="216"/><line x1="440" y1="104" x2="454" y2="216"/>
      <line x1="490" y1="104" x2="466" y2="216"/><line x1="540" y1="104" x2="468" y2="216"/>
      <line x1="390" y1="136" x2="450" y2="216"/><line x1="440" y1="136" x2="456" y2="216"/>
      <line x1="490" y1="136" x2="462" y2="216"/><line x1="540" y1="136" x2="464" y2="216"/>
    </g>
    <text x="470" y="292" text-anchor="middle" font-size="11.5" fill="#666">8 个 Q 头共享 1 组 KV</text>
    <text x="470" y="312" text-anchor="middle" font-size="11.5" fill="#166B54" font-weight="bold">KV Cache：1/8（12.5%）</text>
    <text x="470" y="332" text-anchor="middle" font-size="10.5" fill="#A81640">质量下降较明显，现已少用</text>
  </g>

  <!-- ===== GQA ===== -->
  <g>
    <text x="780" y="62" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#166B54">GQA（分组查询，Llama2-70B / Llama3）</text>
    <g font-size="10.5" fill="#1B4E9B">
      <rect x="680" y="80" width="40" height="24" rx="4" fill="#4C88F7" fill-opacity="0.5" stroke="#4C88F7"/><text x="700" y="96" text-anchor="middle">Q0</text>
      <rect x="730" y="80" width="40" height="24" rx="4" fill="#4C88F7" fill-opacity="0.5" stroke="#4C88F7"/><text x="750" y="96" text-anchor="middle">Q1</text>
      <rect x="780" y="80" width="40" height="24" rx="4" fill="#4C88F7" fill-opacity="0.5" stroke="#4C88F7"/><text x="800" y="96" text-anchor="middle">Q2</text>
      <rect x="830" y="80" width="40" height="24" rx="4" fill="#4C88F7" fill-opacity="0.5" stroke="#4C88F7"/><text x="850" y="96" text-anchor="middle">Q3</text>
      <rect x="680" y="112" width="40" height="24" rx="4" fill="#4C88F7" fill-opacity="0.5" stroke="#4C88F7"/><text x="700" y="128" text-anchor="middle">Q4</text>
      <rect x="730" y="112" width="40" height="24" rx="4" fill="#4C88F7" fill-opacity="0.5" stroke="#4C88F7"/><text x="750" y="128" text-anchor="middle">Q5</text>
      <rect x="780" y="112" width="40" height="24" rx="4" fill="#4C88F7" fill-opacity="0.5" stroke="#4C88F7"/><text x="800" y="128" text-anchor="middle">Q6</text>
      <rect x="830" y="112" width="40" height="24" rx="4" fill="#4C88F7" fill-opacity="0.5" stroke="#4C88F7"/><text x="850" y="128" text-anchor="middle">Q7</text>
    </g>
    <g font-size="10.5" fill="#1E6B34">
      <rect x="690" y="216" width="50" height="26" rx="4" fill="#34A853" fill-opacity="0.45" stroke="#34A853" stroke-width="1.5"/>
      <text x="715" y="234" text-anchor="middle" font-weight="bold">KV0</text>
      <rect x="790" y="216" width="50" height="26" rx="4" fill="#34A853" fill-opacity="0.45" stroke="#34A853" stroke-width="1.5"/>
      <text x="815" y="234" text-anchor="middle" font-weight="bold">KV1</text>
    </g>
    <g stroke="#999" stroke-width="1">
      <line x1="700" y1="104" x2="712" y2="216"/><line x1="750" y1="104" x2="714" y2="216"/>
      <line x1="700" y1="136" x2="710" y2="216"/><line x1="750" y1="136" x2="716" y2="216"/>
      <line x1="800" y1="104" x2="812" y2="216"/><line x1="850" y1="104" x2="814" y2="216"/>
      <line x1="800" y1="136" x2="810" y2="216"/><line x1="850" y1="136" x2="816" y2="216"/>
    </g>
    <text x="780" y="292" text-anchor="middle" font-size="11.5" fill="#666">每 4 个 Q 头共享 1 组 KV</text>
    <text x="780" y="312" text-anchor="middle" font-size="11.5" fill="#166B54" font-weight="bold">KV Cache：1/4（25%）</text>
    <text x="780" y="332" text-anchor="middle" font-size="10.5" fill="#166B54">质量几乎无损的折中 → 主流标配</text>
  </g>

  <!-- 底部账单 -->
  <rect x="80" y="356" width="800" height="48" rx="10" fill="#FAFAFA" stroke="#CCC" stroke-width="1.2"/>
  <text x="480" y="376" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#444">KV Cache 字节数 = 2 × 层数 × KV头数 × d_head × 序列长度 × 精度</text>
  <text x="480" y="394" text-anchor="middle" font-size="11" fill="#888">算子接口里的 num_heads / num_kv_heads（Q 头数 / KV 头数）就是这两层拓扑的参数化</text>
</svg>
