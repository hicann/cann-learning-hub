<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">8-bit 数据格式位布局对比</text>

  <!-- E4M3 -->
  <g transform="translate(60,60)">
    <text x="0" y="18" font-size="15" font-weight="bold" fill="#1f2937">FP8 E4M3（精度优先）</text>
    <rect x="0" y="28" width="40" height="44" fill="#ef4444" rx="4"/>
    <rect x="44" y="28" width="140" height="44" fill="#3b82f6" rx="4"/>
    <rect x="188" y="28" width="110" height="44" fill="#10b981" rx="4"/>
    <text x="20" y="56" text-anchor="middle" font-size="14" fill="#fff">S</text>
    <text x="114" y="56" text-anchor="middle" font-size="14" fill="#fff">E ×4（bias 7）</text>
    <text x="243" y="56" text-anchor="middle" font-size="14" fill="#fff">M ×3</text>
    <text x="0" y="92" font-size="13" fill="#4b5563">阶码 18 个 → 动态范围小（max ≈ 448），尾数多 → 精度高</text>
    <text x="0" y="112" font-size="13" fill="#4b5563">典型用途：激活值、KV Cache 数据（MXFP8 的数据位）</text>
  </g>

  <!-- E5M2 -->
  <g transform="translate(60,190)">
    <text x="0" y="18" font-size="15" font-weight="bold" fill="#1f2937">FP8 E5M2（范围优先）</text>
    <rect x="0" y="28" width="40" height="44" fill="#ef4444" rx="4"/>
    <rect x="44" y="28" width="172" height="44" fill="#3b82f6" rx="4"/>
    <rect x="220" y="28" width="78" height="44" fill="#10b981" rx="4"/>
    <text x="20" y="56" text-anchor="middle" font-size="14" fill="#fff">S</text>
    <text x="130" y="56" text-anchor="middle" font-size="14" fill="#fff">E ×5（bias 15）</text>
    <text x="259" y="56" text-anchor="middle" font-size="14" fill="#fff">M ×2</text>
    <text x="0" y="92" font-size="13" fill="#4b5563">阶码 32 个 → 动态范围大（max ≈ 57344），尾数少 → 精度低</text>
    <text x="0" y="112" font-size="13" fill="#4b5563">典型用途：权重、梯度</text>
  </g>

  <!-- E8M0 -->
  <g transform="translate(520,60)">
    <text x="0" y="18" font-size="15" font-weight="bold" fill="#1f2937">FP8 E8M0（纯缩放因子）</text>
    <rect x="0" y="28" width="290" height="44" fill="#3b82f6" rx="4"/>
    <text x="145" y="56" text-anchor="middle" font-size="14" fill="#fff">E ×8（值 = 2^E-127）</text>
    <text x="0" y="92" font-size="13" fill="#4b5563">没有符号与尾数，只能表示 2 的幂</text>
    <text x="0" y="112" font-size="13" fill="#4b5563">专门用作 MX 系格式的块缩放因子（scale）</text>
  </g>

  <!-- HiF8 -->
  <g transform="translate(520,190)">
    <text x="0" y="18" font-size="15" font-weight="bold" fill="#1f2937">HiF8（动态点位域，昇腾）</text>
    <rect x="0" y="28" width="40" height="44" fill="#ef4444" rx="4"/>
    <rect x="44" y="28" width="130" height="44" fill="#8b5cf6" rx="4"/>
    <rect x="178" y="28" width="112" height="44" fill="#10b981" rx="4"/>
    <text x="20" y="56" text-anchor="middle" font-size="14" fill="#fff">S</text>
    <text x="109" y="56" text-anchor="middle" font-size="14" fill="#fff">Dot + E（变长）</text>
    <text x="234" y="56" text-anchor="middle" font-size="14" fill="#fff">M（变长）</text>
    <text x="0" y="92" font-size="13" fill="#4b5563">锥形精度：靠近 1 精度高，远离 1 精度渐降（无跳变）</text>
    <text x="0" y="112" font-size="13" fill="#4b5563">综合阶码 [-22,15] 共 38 个，接近 FP16；单数据格式免块 scale</text>
  </g>

  <!-- bottom summary -->
  <g transform="translate(60,340)">
    <rect x="0" y="0" width="740" height="100" fill="#f0f9ff" stroke="#7dd3fc" rx="8"/>
    <text x="20" y="30" font-size="14" font-weight="bold" fill="#0369a1">黄金法则：低精度用于「存储与传输」，高精度用于「计算」</text>
    <text x="20" y="56" font-size="13" fill="#0c4a6e">类比：int8 × int8 → int32 累加；FP8 × FP8 → FP32 累加</text>
    <text x="20" y="80" font-size="13" fill="#0c4a6e">矩阵乘的成千上万次累加若用 8-bit 累加，会迅速溢出 / 丢失精度（448 × 448 = 200704 ≫ 448）</text>
  </g>
</svg>
