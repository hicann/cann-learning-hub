<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="980" height="640" fill="#FAFBFD"/>
  <text x="490" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">三种执行编排：串行 → N Buffer 流水 → Preload 流水（每格 1 个 KV 基本块）</text>

  <!-- legend -->
  <g transform="translate(280,44)">
    <rect x="0" y="0" width="26" height="14" fill="#4E79A7" rx="3"/><text x="32" y="11" font-size="12" fill="#333">C1 / C2（Cube）</text>
    <rect x="150" y="0" width="26" height="14" fill="#F28E2B" rx="3"/><text x="182" y="11" font-size="12" fill="#333">V1 / V2（Vector）</text>
    <rect x="310" y="0" width="26" height="14" fill="#E69F00" rx="3"/><text x="342" y="11" font-size="12" fill="#333">断流（空等）</text>
  </g>

  <!-- ===== 串行 ===== -->
  <g transform="translate(40,80)">
    <text x="0" y="14" font-size="15" font-weight="bold" fill="#A23B3B">① 串行执行</text>
    <text x="0" y="34" font-size="12" fill="#666">Cube 与 Vector 完全没有并行</text>
    <!-- task rows -->
    <g transform="translate(0,46)">
      <!-- block i -->
      <rect x="0"   y="0" width="60" height="30" fill="#4E79A7" rx="4"/><text x="30" y="20" text-anchor="middle" font-size="12" fill="#fff">C1₀</text>
      <rect x="62"  y="0" width="86" height="30" fill="#F28E2B" rx="4"/><text x="105" y="20" text-anchor="middle" font-size="12" fill="#fff">V1₀</text>
      <rect x="150" y="0" width="60" height="30" fill="#4E79A7" rx="4"/><text x="180" y="20" text-anchor="middle" font-size="12" fill="#fff">C2₀</text>
      <rect x="212" y="0" width="44" height="30" fill="#F28E2B" rx="4"/><text x="234" y="20" text-anchor="middle" font-size="12" fill="#fff">V2₀</text>
      <!-- block i+1 -->
      <rect x="258" y="0" width="60" height="30" fill="#4E79A7" rx="4"/><text x="288" y="20" text-anchor="middle" font-size="12" fill="#fff">C1₁</text>
      <rect x="320" y="0" width="86" height="30" fill="#F28E2B" rx="4"/><text x="363" y="20" text-anchor="middle" font-size="12" fill="#fff">V1₁</text>
      <rect x="408" y="0" width="60" height="30" fill="#4E79A7" rx="4"/><text x="438" y="20" text-anchor="middle" font-size="12" fill="#fff">C2₁</text>
      <rect x="470" y="0" width="44" height="30" fill="#F28E2B" rx="4"/><text x="492" y="20" text-anchor="middle" font-size="12" fill="#fff">V2₁</text>
      <rect x="518" y="0" width="24" height="30" fill="#DDD" rx="4"/>
      <!-- axis -->
      <line x1="0" y1="40" x2="542" y2="40" stroke="#888" stroke-width="1.5"/>
      <text x="0" y="58" font-size="11" fill="#666">时间 →</text>
    </g>
    <text x="0" y="168" font-size="12" fill="#A23B3B">每拍之间互相等待，总时长 = 所有拍时长之和</text>
  </g>

  <!-- ===== N Buffer ===== -->
  <g transform="translate(40,270)">
    <text x="0" y="14" font-size="15" font-weight="bold" fill="#B05A2A">② N Buffer 流水（N=2）</text>
    <text x="0" y="34" font-size="12" fill="#666">两组交替：算第 i 组时填第 i+1 组</text>
    <g transform="translate(0,46)">
      <!-- AIC row -->
      <rect x="0"   y="0" width="60" height="30" fill="#4E79A7" rx="4"/><text x="30" y="20" text-anchor="middle" font-size="12" fill="#fff">C1₀</text>
      <rect x="62"  y="0" width="60" height="30" fill="#4E79A7" rx="4"/><text x="92" y="20" text-anchor="middle" font-size="12" fill="#fff">C1₁</text>
      <rect x="124" y="0" width="34" height="30" fill="#DDD" rx="4"/>
      <rect x="158" y="0" width="60" height="30" fill="#4E79A7" rx="4"/><text x="188" y="20" text-anchor="middle" font-size="12" fill="#fff">C2₀</text>
      <rect x="220" y="0" width="60" height="30" fill="#4E79A7" rx="4"/><text x="250" y="20" text-anchor="middle" font-size="12" fill="#fff">C2₁</text>
      <rect x="282" y="0" width="34" height="30" fill="#DDD" rx="4"/>
      <rect x="316" y="0" width="60" height="30" fill="#4E79A7" rx="4"/><text x="346" y="20" text-anchor="middle" font-size="12" fill="#fff">C1₂</text>
      <rect x="378" y="0" width="60" height="30" fill="#4E79A7" rx="4"/><text x="408" y="20" text-anchor="middle" font-size="12" fill="#fff">C1₃</text>
      <text x="0" y="-6" font-size="11" fill="#0B62A4">AIC：</text>
      <!-- AIV row -->
      <rect x="0"   y="40" width="60" height="30" fill="#DDD" rx="4"/>
      <rect x="64"  y="40" width="86" height="30" fill="#F28E2B" rx="4"/><text x="107" y="60" text-anchor="middle" font-size="12" fill="#fff">V1₀</text>
      <rect x="152" y="40" width="86" height="30" fill="#F28E2B" rx="4"/><text x="195" y="60" text-anchor="middle" font-size="12" fill="#fff">V1₁</text>
      <rect x="240" y="40" width="44" height="30" fill="#F28E2B" rx="4"/><text x="262" y="60" text-anchor="middle" font-size="12" fill="#fff">V2₀</text>
      <rect x="286" y="40" width="44" height="30" fill="#F28E2B" rx="4"/><text x="308" y="60" text-anchor="middle" font-size="12" fill="#fff">V2₁</text>
      <rect x="332" y="40" width="86" height="30" fill="#F28E2B" rx="4"/><text x="375" y="60" text-anchor="middle" font-size="12" fill="#fff">V1₂</text>
      <text x="0" y="60" font-size="11" fill="#B05A2A">AIV：</text>
      <line x1="0" y1="86" x2="438" y2="86" stroke="#888" stroke-width="1.5"/>
      <text x="0" y="104" font-size="11" fill="#666">时间 →</text>
    </g>
    <text x="0" y="180" font-size="12" fill="#B05A2A">Cube 有断流：较长的 V1 拖住了 C2 的发射（灰色空等段）</text>
  </g>

  <!-- ===== Preload ===== -->
  <g transform="translate(40,470)">
    <text x="0" y="14" font-size="15" font-weight="bold" fill="#2A6F3E">③ Preload 流水（1 轮）</text>
    <text x="0" y="34" font-size="12" fill="#666">把当前轮 V1 对应的 C2 放到下一轮发射，互换 C1/C2 位置</text>
    <g transform="translate(0,46)">
      <!-- AIC row -->
      <rect x="0"   y="0" width="60" height="30" fill="#4E79A7" rx="4"/><text x="30" y="20" text-anchor="middle" font-size="12" fill="#fff">C1₀</text>
      <rect x="62"  y="0" width="60" height="30" fill="#4E79A7" rx="4"/><text x="92" y="20" text-anchor="middle" font-size="12" fill="#fff">C1₁</text>
      <rect x="124" y="0" width="60" height="30" fill="#4E79A7" rx="4"/><text x="154" y="20" text-anchor="middle" font-size="12" fill="#fff">C2₀</text>
      <rect x="186" y="0" width="60" height="30" fill="#4E79A7" rx="4"/><text x="216" y="20" text-anchor="middle" font-size="12" fill="#fff">C1₂</text>
      <rect x="248" y="0" width="60" height="30" fill="#4E79A7" rx="4"/><text x="278" y="20" text-anchor="middle" font-size="12" fill="#fff">C2₁</text>
      <rect x="310" y="0" width="60" height="30" fill="#4E79A7" rx="4"/><text x="340" y="20" text-anchor="middle" font-size="12" fill="#fff">C1₃</text>
      <rect x="372" y="0" width="60" height="30" fill="#4E79A7" rx="4"/><text x="402" y="20" text-anchor="middle" font-size="12" fill="#fff">C2₂</text>
      <text x="0" y="-6" font-size="11" fill="#0B62A4">AIC：</text>
      <!-- AIV row -->
      <rect x="0"   y="40" width="60" height="30" fill="#DDD" rx="4"/>
      <rect x="64"  y="40" width="86" height="30" fill="#F28E2B" rx="4"/><text x="107" y="60" text-anchor="middle" font-size="12" fill="#fff">V1₀</text>
      <rect x="152" y="40" width="86" height="30" fill="#F28E2B" rx="4"/><text x="195" y="60" text-anchor="middle" font-size="12" fill="#fff">V1₁</text>
      <rect x="240" y="40" width="44" height="30" fill="#F28E2B" rx="4"/><text x="262" y="60" text-anchor="middle" font-size="12" fill="#fff">V2₀</text>
      <rect x="286" y="40" width="86" height="30" fill="#F28E2B" rx="4"/><text x="329" y="60" text-anchor="middle" font-size="12" fill="#fff">V1₂</text>
      <rect x="374" y="40" width="44" height="30" fill="#F28E2B" rx="4"/><text x="396" y="60" text-anchor="middle" font-size="12" fill="#fff">V2₁</text>
      <text x="0" y="60" font-size="11" fill="#B05A2A">AIV：</text>
      <line x1="0" y1="86" x2="432" y2="86" stroke="#888" stroke-width="1.5"/>
      <text x="0" y="104" font-size="11" fill="#666">时间 →</text>
    </g>
    <text x="460" y="14" font-size="12" fill="#2A6F3E">AIC 无断流：</text>
    <text x="460" y="34" font-size="12" fill="#2A6F3E">用两个 Cube 阶段</text>
    <text x="460" y="54" font-size="12" fill="#2A6F3E">（C1、C2）掩盖一个</text>
    <text x="460" y="74" font-size="12" fill="#2A6F3E">较长的 V1 阶段</text>
  </g>
</svg>
