<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">UB Bank 组织与 Bank 冲突</text>

  <!-- bank hierarchy -->
  <g transform="translate(50,60)">
    <text x="0" y="0" font-size="15" font-weight="bold" fill="#1f2937">层级：bank group → bank → block（32B）</text>
    <g transform="translate(0,16)">
      <rect x="0" y="0" width="120" height="150" fill="#ede9fe" stroke="#8b5cf6" rx="6"/>
      <text x="60" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b21b6">bank group</text>
      <rect x="14" y="40" width="92" height="46" fill="#ddd6fe" stroke="#8b5cf6" rx="4"/>
      <text x="60" y="68" text-anchor="middle" font-size="12" fill="#5b21b6">bank 0</text>
      <rect x="14" y="94" width="92" height="46" fill="#ddd6fe" stroke="#8b5cf6" rx="4"/>
      <text x="60" y="122" text-anchor="middle" font-size="12" fill="#5b21b6">bank 1</text>
      <text x="150" y="60" font-size="12" fill="#4b5563">每个 bank 由若干</text>
      <text x="150" y="80" font-size="12" fill="#4b5563">32B 的 block 组成</text>
      <text x="150" y="110" font-size="12" fill="#b91c1c">同时访问同一 bank 的</text>
      <text x="150" y="130" font-size="12" fill="#b91c1c">不同地址 → 串行化</text>
    </g>
  </g>

  <!-- David vs 1971 -->
  <g transform="translate(480,60)">
    <text x="0" y="0" font-size="15" font-weight="bold" fill="#1f2937">两种交织（代际差异）</text>
    <g transform="translate(0,16)">
      <rect x="0" y="0" width="180" height="64" fill="#dbeafe" stroke="#3b82f6" rx="6"/>
      <text x="90" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">David：低位交织</text>
      <text x="90" y="46" text-anchor="middle" font-size="11" fill="#1e3a8a">8 组 × 2 bank，256KB</text>
      <text x="0" y="86" font-size="12" fill="#1e3a8a">bank0 与 bank1 地址相邻 256B</text>
      <text x="0" y="106" font-size="12" fill="#1e3a8a">（block 交替排布）</text>
    </g>
    <g transform="translate(220,16)">
      <rect x="0" y="0" width="180" height="64" fill="#dcfce7" stroke="#22c55e" rx="6"/>
      <text x="90" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">1971：高位交织</text>
      <text x="90" y="46" text-anchor="middle" font-size="11" fill="#14532d">16 组 × 3 bank，192KB</text>
      <text x="-60" y="86" font-size="12" fill="#14532d">bank 连续存放 64KB</text>
      <text x="-60" y="106" font-size="12" fill="#14532d">（排完一个 bank 再排下一个）</text>
    </g>
  </g>

  <!-- conflict types -->
  <g transform="translate(50,280)">
    <text x="0" y="0" font-size="15" font-weight="bold" fill="#1f2937">三类冲突的判定（以 David 为例，256 取模）</text>
    <g transform="translate(0,16)" font-size="12">
      <rect x="0" y="0" width="260" height="72" fill="#fef2f2" stroke="#f87171" rx="6"/>
      <text x="14" y="24" font-weight="bold" fill="#991b1b">读读 / 写写冲突</text>
      <text x="14" y="46" fill="#7f1d1d">两地址 block 起始地址对 256</text>
      <text x="14" y="62" fill="#7f1d1d">取模余数相等（1971 为 512）</text>

      <rect x="280" y="0" width="260" height="72" fill="#fffbeb" stroke="#fbbf24" rx="6"/>
      <text x="294" y="24" font-weight="bold" fill="#92400e">读写冲突</text>
      <text x="294" y="46" fill="#78350f">取模余数相等，且起始地址之差</text>
      <text x="294" y="62" fill="#78350f">可被 512 整除（1971：≤65024）</text>

      <rect x="560" y="0" width="260" height="72" fill="#f0f9ff" stroke="#38bdf8" rx="6"/>
      <text x="574" y="24" font-weight="bold" fill="#0369a1">仲裁优先级</text>
      <text x="574" y="46" fill="#075985">VEC &gt; Scalar &gt; MTE</text>
      <text x="574" y="62" fill="#075985">同 pipe 内 Write &gt; Read</text>
    </g>
  </g>

  <!-- solutions -->
  <g transform="translate(50,410)">
    <rect x="0" y="0" width="820" height="88" fill="#f0fdf4" stroke="#86efac" rx="8"/>
    <text x="16" y="26" font-size="14" font-weight="bold" fill="#166534">解冲突三板斧</text>
    <text x="16" y="50" font-size="12" fill="#14532d">① 单条 VEC 指令操作不超过 256B；② 读写 pingpong：输入与输出分放不同缓冲，避免读写冲突</text>
    <text x="16" y="72" font-size="12" fill="#14532d">③ 读/写的 8 个 block 尽量分布到 8 个不同的 bank group；定位：dump log 搜 BGBK_CFLT / CFLT_BLOCKED，按 PC 指针回查指令</text>
  </g>
</svg>
