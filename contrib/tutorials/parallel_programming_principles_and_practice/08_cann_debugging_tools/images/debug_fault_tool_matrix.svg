<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<title>CANN调试工具与故障矩阵</title><desc>四类msSanitizer故障和msDebug调试条件。</desc><rect width="1200" height="650" fill="#fff"/>
<text x="40" y="52" font-size="28" font-weight="bold" fill="#222" font-family="Microsoft YaHei,Arial,sans-serif">CANN 调试工具与故障矩阵</text>
<g font-family="Microsoft YaHei,Arial,sans-serif"><rect x="40" y="90" width="1120" height="54" fill="#344b67"/><g fill="#fff" font-size="18" font-weight="bold" text-anchor="middle"><text x="140" y="125">工具</text><text x="435" y="125">故障代码</text><text x="870" y="125">核心诊断</text></g>
<g stroke="#aab5c2" fill="#f7f9fc"><rect x="40" y="144" width="1120" height="70"/><rect x="40" y="214" width="1120" height="70" fill="#fff"/><rect x="40" y="284" width="1120" height="70"/><rect x="40" y="354" width="1120" height="70" fill="#fff"/></g>
<g font-size="17" fill="#222"><text x="80" y="187">memcheck</text><text x="255" y="187">DataCopy 2048 → 4096 float</text><text x="705" y="187">illegal write</text><text x="80" y="257">racecheck</text><text x="255" y="257">删除 MTE2 → Vector 同步</text><text x="705" y="257">Potential RAW hazard</text><text x="80" y="327">initcheck</text><text x="255" y="327">未初始化 zLocal 就搬出</text><text x="705" y="327">uninitialized read</text><text x="80" y="397">synccheck</text><text x="255" y="397">SetFlag 无对应 WaitFlag</text><text x="705" y="397">Unpaired set_flag</text></g></g>
<rect x="40" y="465" width="1120" height="130" rx="12" fill="#eef4ff" stroke="#5b88c9" stroke-width="2"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="70" y="505" font-size="21" font-weight="bold" fill="#244e87">msDebug</text><text x="70" y="542" font-size="17" fill="#222">管理员启用调试开关，当前用户可读写 /dev/drv_debug</text><text x="70" y="575" font-size="17" fill="#222">breakpoint set → run → thread backtrace → frame info → source list → continue</text></g>
</svg>
