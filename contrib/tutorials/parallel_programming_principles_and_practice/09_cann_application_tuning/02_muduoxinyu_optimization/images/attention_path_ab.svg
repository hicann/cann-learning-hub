<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<title>MuduoXinyu Attention A/B</title><desc>FP32多算子基线与FP16 FlashAttention路径的公平比较。</desc><rect width="1200" height="620" fill="#fff"/>
<text x="40" y="52" font-size="28" font-weight="bold" fill="#222" font-family="Microsoft YaHei,Arial,sans-serif">MuduoXinyu Attention A/B</text>
<rect x="55" y="95" width="515" height="300" rx="14" fill="#e8f1ff" stroke="#5b88c9" stroke-width="2"/><rect x="630" y="95" width="515" height="300" rx="14" fill="#eef9f1" stroke="#4a9b62" stroke-width="2"/>
<g font-family="Microsoft YaHei,Arial,sans-serif"><text x="90" y="140" font-size="24" font-weight="bold" fill="#244e87">Path A：FP32 多算子</text><text x="665" y="140" font-size="24" font-weight="bold" fill="#176b35">Path B：FlashAttention</text><g font-size="18" fill="#222"><text x="90" y="195">QK MatMul</text><text x="90" y="235">→ Scale / Mask / Softmax</text><text x="90" y="275">→ Attention × V</text><text x="90" y="330">基线：多个 ACLNN 算子</text><text x="665" y="195">FP32 → FP16</text><text x="665" y="235">→ aclnnIncreFlashAttentionV4</text><text x="665" y="275">→ FP16 → FP32</text><text x="665" y="330">候选：融合 Attention</text></g></g>
<rect x="120" y="440" width="960" height="125" rx="12" fill="#fff7e8" stroke="#d28a25" stroke-width="2"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="600" y="477" text-anchor="middle" font-size="21" font-weight="bold" fill="#8a5511">公平比较条件</text><text x="600" y="515" text-anchor="middle" font-size="17" fill="#222">同模型 · 同 tokenizer · 同 prompt/steps · temperature=0 · topP=1</text><text x="600" y="545" text-anchor="middle" font-size="17" fill="#222">先检查 token exact 与 fallback=0，再比较 1 次预热 + 3 次统计</text></g>
</svg>
