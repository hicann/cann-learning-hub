<?xml version="1.0" encoding="UTF-8"?>
<svg width="2560" height="1440" viewBox="0 0 1800 1200" version="1.1" xmlns="http://www.w3.org/2000/svg">
<style type="text/css">
  .title { font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 40px; fill: #333; text-anchor: middle; font-weight: bold; }
  .axis-label { font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 24px; fill: #555; text-anchor: middle; }
  .tick { font-family: Arial, sans-serif; font-size: 20px; fill: #777; text-anchor: middle; }
  .tick-y { font-family: Arial, sans-serif; font-size: 20px; fill: #777; text-anchor: end; }
  .legend { font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 22px; fill: #333; }
  .annot { font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 20px; fill: #E65100; }
</style>
<rect width="1800" height="1200" fill="#f8f9fa" rx="16"/>
<text x="900" y="70" class="title">注意力算子复杂度实测：O(S²) 增长曲线</text>
<text x="900" y="115" class="annot" style="font-size:22px;">实测数据（dim=64，40 AIV 核）：85 ms / 355 ms / 1386 ms / 5506 ms —— seq_len 翻倍，耗时约 ×4</text>

<line x1="180" y1="980" x2="1700" y2="980" stroke="#333" stroke-width="3"/>
<line x1="180" y1="980" x2="180" y2="160" stroke="#333" stroke-width="3"/>

<text x="180" y="1040" class="tick">512</text>
<text x="686" y="1040" class="tick">1024</text>
<text x="1193" y="1040" class="tick">2048</text>
<text x="1700" y="1040" class="tick">4096</text>
<text x="940" y="1090" class="axis-label">seq_len S</text>

<text x="110" y="955" class="tick-y">85</text>
<text x="110" y="755" class="tick-y">355</text>
<text x="110" y="330" class="tick-y">1386</text>
<text x="110" y="100" class="tick-y">5506</text>
<text x="70" y="560" class="axis-label" transform="rotate(-90 70 560)">耗时（ms）</text>

<line x1="180" y1="955" x2="1700" y2="955" stroke="#ddd" stroke-width="1.5" stroke-dasharray="6,4"/>
<line x1="180" y1="755" x2="1700" y2="755" stroke="#ddd" stroke-width="1.5" stroke-dasharray="6,4"/>
<line x1="180" y1="330" x2="1700" y2="330" stroke="#ddd" stroke-width="1.5" stroke-dasharray="6,4"/>
<line x1="180" y1="100" x2="1700" y2="100" stroke="#ddd" stroke-width="1.5" stroke-dasharray="6,4"/>

<line x1="512" y1="160" x2="512" y2="980" stroke="#ddd" stroke-width="1.5" stroke-dasharray="6,4"/>
<line x1="1024" y1="160" x2="1024" y2="980" stroke="#ddd" stroke-width="1.5" stroke-dasharray="6,4"/>
<line x1="1536" y1="160" x2="1536" y2="980" stroke="#ddd" stroke-width="1.5" stroke-dasharray="6,4"/>

<polyline points="512,955 1024,755 1536,330 1700,100" fill="none" stroke="#E65100" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="512" cy="955" r="10" fill="#E65100"/>
<circle cx="1024" cy="755" r="10" fill="#E65100"/>
<circle cx="1536" cy="330" r="10" fill="#E65100"/>
<circle cx="1700" cy="100" r="10" fill="#E65100"/>

<text x="590" y="920" class="annot">85 ms</text>
<text x="1090" y="725" class="annot">355 ms（×4.2）</text>
<text x="1450" y="300" class="annot">1386 ms（×3.9）</text>
<text x="1560" y="75" class="annot">5506 ms（×4.0）</text>

<text x="950" y="180" class="legend">◤ 理论：FLOPs = 4·S²·D（QKᵀ + AV 各 2·S²·D）→ 复杂度 O(S²)</text>
<text x="950" y="220" class="legend">◤ 实测：S 翻倍 → 耗时 ≈ ×4，与 O(S²) 理论一致</text>

<line x1="740" y1="870" x2="900" y2="780" stroke="#E65100" stroke-width="2" stroke-dasharray="6,4"/>
<text x="700" y="900" class="annot">对比：Flash Attention 理论 O(S) 显存 / 近线性</text>
</svg>
