<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560">
  <style>
    .title { font: 700 24px sans-serif; fill: #1f2937; }
    .section { font: 700 19px sans-serif; fill: #111827; }
    .label { font: 16px sans-serif; fill: #111827; }
    .axis { stroke: #6b7280; stroke-width: 2; marker-end: url(#arrow); }
    .grid { stroke: #d1d5db; stroke-width: 1; stroke-dasharray: 4 5; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>
  <text x="35" y="38" class="title">单缓冲与双缓冲的阶段时序</text>
  <text x="35" y="83" class="section">单缓冲：一个 Tile 完成后才开始下一个 Tile</text>
  <text x="35" y="130" class="label">MTE2</text>
  <text x="35" y="180" class="label">Vector</text>
  <text x="35" y="230" class="label">MTE3</text>
  <rect x="130" y="105" width="120" height="34" rx="6" fill="#60a5fa"/><text x="190" y="128" text-anchor="middle" class="label">Load 0</text>
  <rect x="250" y="155" width="100" height="34" rx="6" fill="#fbbf24"/><text x="300" y="178" text-anchor="middle" class="label">Add 0</text>
  <rect x="350" y="205" width="120" height="34" rx="6" fill="#34d399"/><text x="410" y="228" text-anchor="middle" class="label">Store 0</text>
  <rect x="470" y="105" width="120" height="34" rx="6" fill="#60a5fa"/><text x="530" y="128" text-anchor="middle" class="label">Load 1</text>
  <rect x="590" y="155" width="100" height="34" rx="6" fill="#fbbf24"/><text x="640" y="178" text-anchor="middle" class="label">Add 1</text>
  <rect x="690" y="205" width="120" height="34" rx="6" fill="#34d399"/><text x="750" y="228" text-anchor="middle" class="label">Store 1</text>
  <line x1="120" y1="260" x2="1080" y2="260" class="axis"/><text x="1090" y="265" class="label">时间</text>

  <text x="35" y="315" class="section">双缓冲：预取下一 Tile，并排空上一结果</text>
  <text x="35" y="365" class="label">MTE2</text>
  <text x="35" y="415" class="label">Vector</text>
  <text x="35" y="465" class="label">MTE3</text>
  <line x1="330" y1="335" x2="330" y2="495" class="grid"/>
  <line x1="530" y1="335" x2="530" y2="495" class="grid"/>
  <line x1="730" y1="335" x2="730" y2="495" class="grid"/>
  <rect x="130" y="340" width="200" height="34" rx="6" fill="#60a5fa"/><text x="230" y="363" text-anchor="middle" class="label">Load 0（预装）</text>
  <rect x="330" y="340" width="200" height="34" rx="6" fill="#60a5fa"/><text x="430" y="363" text-anchor="middle" class="label">Load 1</text>
  <rect x="530" y="340" width="200" height="34" rx="6" fill="#60a5fa"/><text x="630" y="363" text-anchor="middle" class="label">Load 2</text>
  <rect x="330" y="390" width="200" height="34" rx="6" fill="#fbbf24"/><text x="430" y="413" text-anchor="middle" class="label">Add 0</text>
  <rect x="530" y="390" width="200" height="34" rx="6" fill="#fbbf24"/><text x="630" y="413" text-anchor="middle" class="label">Add 1</text>
  <rect x="730" y="390" width="200" height="34" rx="6" fill="#fbbf24"/><text x="830" y="413" text-anchor="middle" class="label">Add 2</text>
  <rect x="530" y="440" width="200" height="34" rx="6" fill="#34d399"/><text x="630" y="463" text-anchor="middle" class="label">Store 0</text>
  <rect x="730" y="440" width="200" height="34" rx="6" fill="#34d399"/><text x="830" y="463" text-anchor="middle" class="label">Store 1</text>
  <rect x="930" y="440" width="120" height="34" rx="6" fill="#34d399"/><text x="990" y="463" text-anchor="middle" class="label">排空 2</text>
  <line x1="120" y1="510" x2="1080" y2="510" class="axis"/><text x="1090" y="515" class="label">时间</text>
</svg>
